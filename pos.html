<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كاشير Diva</title>
<style>
:root{--p:#815a19;--p2:#a67420;--bg:#fbf6f0;--bd:#e8ddd2;--tx:#2b2220;--mut:#8a7b72;--ok:#2e7d32;--warn:#e65100}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px;background:#fff;width:100%;color:var(--tx)}
input[type=checkbox]{width:auto}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mut)}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--p2)}
.btn.o{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.g{background:#eee;color:#333}
.btn.r{background:#c62828}
.btn.ok{background:var(--ok)}
.btn.s{padding:3px 9px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:18px;margin-top:8px}
.top{background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;position:sticky;top:0;z-index:10}
.top .logo{white-space:nowrap}
.top nav{display:flex;overflow-x:auto;flex:1}
.top nav a{padding:13px 12px;cursor:pointer;white-space:nowrap}
.top nav a.on{background:#fff2;border-bottom:3px solid #fff}
.top .u{white-space:nowrap;font-size:13px}
.top .u a{cursor:pointer;text-decoration:underline;margin-right:6px}
.bd{background:#ffb300;color:#000;border-radius:10px;padding:0 6px;font-size:12px}
.wrap{padding:12px;max-width:1400px;margin:auto}
.banner{background:#fff3cd;padding:8px 14px;font-size:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row>input,.row>select{flex:1;min-width:110px;width:auto}
.pos{display:grid;grid-template-columns:1fr 390px;gap:12px;align-items:start}
.cartbox{position:sticky;top:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.pc:hover{border-color:var(--p);box-shadow:0 2px 8px #0002}
.pc.out{opacity:.55}
.pn{font-weight:600;font-size:14px}.ps{color:var(--mut);font-size:13px}.pp{color:var(--p);font-weight:700;margin-top:4px}
.st{font-size:12px;color:var(--mut)}.st.lw{color:var(--warn);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.chips a{padding:5px 12px;border:1px solid var(--bd);background:#fff;border-radius:16px;cursor:pointer;white-space:nowrap;font-size:13px}
.chips a.on{background:var(--p);color:#fff;border-color:var(--p)}
.items{max-height:260px;overflow:auto}
.ci{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--bd);padding:6px 0}
.cn{flex:1;font-size:14px}.ct{width:62px;text-align:left;font-weight:600}
.ci a{cursor:pointer;color:#c62828}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--p);background:#fff;color:var(--p);cursor:pointer;font-size:16px}
.tot{font-size:14px;margin-top:8px}.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .g{font-size:22px;font-weight:700;color:var(--p);border-top:2px solid var(--bd);margin-top:4px;padding-top:6px}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
th{background:#f6ece3;white-space:nowrap}
tr.cx td{color:#aaa;text-decoration:line-through}
.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--p)}.kpi.pos b{color:var(--ok)}.kpi.neg b{color:#c62828}
.login{max-width:360px;margin:8vh auto;background:#fff;border-radius:16px;padding:24px;text-align:center;border:1px solid var(--bd)}
.login h1{color:var(--p);margin:0}
.ulist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.login input{margin-bottom:10px;text-align:center;font-size:20px}
#modal .ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:min(520px,94vw);max-height:92vh;overflow:auto}
#modal .box.wide{width:min(720px,96vw)}
.pv{width:100%;height:380px;border:1px solid var(--bd);border-radius:8px;margin:8px 0}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.perms label{margin:0;color:var(--tx);font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1}
h3{margin:0 0 8px}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--bd);background:#f6ece3;display:block}
.oc{border:2px solid #ffb300;background:#fffdf5}
.oc .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pill{display:inline-block;border-radius:12px;padding:1px 10px;font-size:12px;background:#eee}
.pill.on{background:#e8f5e9;color:var(--ok)}.pill.off{background:#fdecea;color:#c62828}
@media(max-width:850px){.pos{grid-template-columns:1fr}.cartbox{position:static}.top .logo{display:none}}
@media(max-width:600px){.wrap{padding:8px}th,td{padding:5px 6px;font-size:13px}.top nav a{padding:13px 9px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.card{padding:10px}}

/* ---- منع الإزاحة لليمين على الموبايل ---- */
html,body{max-width:100%;overflow-x:clip}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
.wrap{min-width:0}
.pos>*{min-width:0}
.chips{max-width:100%}
input,select,textarea{max-width:100%}
.card{min-width:0}
</style>
</head>

<script>
'use strict';
/* ================= أدوات ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=v=>(Math.round((+v||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=x=>String(x).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const dt=d=>{d=new Date(d);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const hash=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const val=id=>($('#'+id)?.value??'').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2500)}
function modal(h,wide){$('#modal').innerHTML=`<div class="ov" onmousedown="if(event.target==this)closeModal()"><div class="box ${wide?'wide':''}">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);

/* ================= Excel (xlsx) بدون مكتبات ================= */
function crc32(b){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let x=-1;for(let i=0;i<b.length;i++)x=t[(x^b[i])&255]^(x>>>8);return(x^-1)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,crc,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(l.buffer),nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const sz=cd.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,sz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(sheets){
 const X=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
 const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
 const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 const files=[
  {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'},
  {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
  {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${X(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
  {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'}];
 sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetData>'+s.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v===null||v===undefined||v==='')return'';return typeof v==='number'&&isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${X(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>'}));
 return zip(files)}

/* ================= الحالة ================= */
const now=new Date();
const S={user:null,page:'pos',cart:[],disc:'',dtype:'amt',cust:'',pay:'',note:'',cat:'',q:'',from:ymd(new Date(now.getFullYear(),now.getMonth(),1)),to:ymd(now),iq:'',area:'',addr:''};
const can=p=>S.user&&(S.user.role==='manager'||S.user.perms.includes(p));
const prod=c=>DB.products.find(p=>p.code===c);
const cust=id=>DB.customers.find(c=>c.id===id);
const lowOf=p=>p.stock!=null&&p.stock<=(p.min??DB.settings.lowStock);
const lowList=()=>DB.products.filter(p=>p.active&&lowOf(p));
const ep=p=>{const d=+p.disc||0;return d>0&&d<100?Math.round(p.price*(100-d))/100:p.price};
const PAGE={};
const go=p=>{S.page=p;render()};

function render(){
 if(!S.user)return login();
 const pg=PAGES.filter(p=>can((p[0]=='site'||p[0]=='mkt')?'settings':p[0]));
 if(!can(S.page))S.page=pg[0]&&pg[0][0];
 const lw=lowList().length,np=CL.pend.length;
 const old=can('settings')&&DB.sales.length&&Date.now()-DB.settings.lastBackup>7*864e5;
 $('#app').innerHTML=`<div class="top"><b class="logo">👑 ${esc(DB.settings.shopName)}</b><nav>${pg.map(p=>`<a class="${S.page==p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]}${p[0]=='products'&&lw?` <span class="bd">${lw}</span>`:''}${p[0]=='orders'&&np?` <span class="bd" id="obd">${np}</span>`:''}</a>`).join('')}</nav><span class="u">${esc(S.user.name)}<a onclick="logout()">خروج</a></span></div>${old?'<div class="banner">⚠️ مفيش نسخة احتياطية من أكتر من أسبوع. ادخل الإعدادات واضغط «نسخة احتياطية».</div>':''}<div class="wrap" id="main"></div>`;
 PAGE[S.page]&&PAGE[S.page]()}

/* ================= الدخول والمستخدمين ================= */
function login(sel){
 const us=DB.users.filter(u=>u.active);sel=sel||localStorage.getItem('diva_last')||(us[0]&&us[0].id);
 $('#app').innerHTML=`<div class="login"><h1>👑 ${esc(DB.settings.shopName)}</h1><p class="mut">اختار المستخدم وادخل الرقم السري</p><div class="ulist">${us.map(u=>`<button class="btn ${u.id==sel?'':'o'}" onclick="login('${u.id}')">${esc(u.name)}</button>`).join('')}</div><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key=='Enter')doLogin('${sel}')"><button class="btn big" onclick="doLogin('${sel}')">دخول</button></div>`;
 setTimeout(()=>$('#pin')&&$('#pin').focus(),50)}
function doLogin(id){const u=DB.users.find(x=>x.id==id);if(!u||u.pin!==hash($('#pin').value))return toast('الرقم السري غلط');
 try{localStorage.setItem('diva_last',id)}catch(e){}
 S.user=u;S.page='pos';render();if(u.mustChange)pinModal(true);cloudStart()}
function logout(){S.user=null;S.cart=[];render()}
function pinModal(force){modal(`<h3>${force?'غيّر الرقم السري الافتراضي':'تغيير الرقم السري'}</h3><label>الرقم الجديد (4 أرقام أو أكتر)</label><input id="np" type="password" inputmode="numeric"><div class="row" style="margin-top:10px"><button class="btn" onclick="setPin()">حفظ</button>${force?'':'<button class="btn g" onclick="closeModal()">إلغاء</button>'}</div>`)}
function setPin(){const v=val('np');if(v.length<4)return toast('4 أرقام على الأقل');S.user.pin=hash(v);S.user.mustChange=false;save('users');closeModal();toast('تم تغيير الرقم السري')}

const CL={tok:'',exp:0,ok:false,pend:[],err:'',timer:null,sTimer:null,sync:null,last:0,seen:null,dirty:new Set(),pushing:false,pulling:false,again:false,syncErr:'',offered:false};
const cfg=()=>DB.settings.cloud;
async function authCall(grant,body){
 const c=cfg();
 const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'فشل تسجيل الدخول');
 CL.tok=j.access_token;CL.exp=Date.now()+(j.expires_in||3600)*1000;
 if(j.refresh_token&&j.refresh_token!==c.rt){c.rt=j.refresh_token;save('settings')}
 CL.ok=true;return j}
async function cloudLogin(pw){return authCall('password',{email:cfg().email,password:pw})}
async function cTok(){
 if(CL.tok&&Date.now()<CL.exp-60000)return CL.tok;
 if(!cfg().rt)throw new Error('غير متصل بالموقع');
 try{await authCall('refresh_token',{refresh_token:cfg().rt})}
 catch(e){if(!navigator.onLine)throw e;CL.ok=false;cfg().rt='';save('settings');throw new Error('انتهت جلسة الربط، سجّل الدخول من الإعدادات')}
 return CL.tok}
async function cApi(path,opt){
 opt=opt||{};const t=await cTok(),c=cfg();
 const r=await fetch(c.url.replace(/\/$/,'')+path,{method:opt.method||'GET',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body});
 const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.error))||('خطأ '+r.status));
 return j}

function toJpeg(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('تعذّر تجهيز الصورة')),'image/jpeg',q)};im.onerror=()=>no(new Error('الملف مش صورة'));im.src=r.result};r.onerror=()=>no(new Error('تعذّر قراءة الملف'));r.readAsDataURL(file)})}
async function uploadImg(path,blob){

 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'فشل رفع الصورة')}
 return c.url.replace(/\/$/,'')+'/storage/v1/object/public/product-images/'+path+'?v='+Date.now()}

const SYNC_COLLS=['products','customers','sales','expenses','users','stocklog','settings'];
const SYNC_SET=new Set(SYNC_COLLS);
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const syncOn=()=>!!(DB.sync&&DB.sync.on&&cfg().rt);
const kid=(c,o)=>c=='products'?o.code:(o.id||(o.id=uid()));
function recs(c){
 if(c=='settings'){const s={...DB.settings};for(const k of['cloud','lastBackup','logoUp'])delete s[k];return[['main',s]]}
 return(DB[c]||[]).map(o=>[kid(c,o),o])}
function schedPush(){if(!syncOn())return;clearTimeout(CL.pt);CL.pt=setTimeout(pushChanges,1200)}
async function pushChanges(){
 if(!syncOn())return;
 if(CL.pushing){CL.again=true;return}
 CL.pushing=true;
 try{
  const rows=[],upd=[];
  for(const c of SYNC_COLLS){
   const snap=DB.sync.snap[c]||(DB.sync.snap[c]={}),seen=new Set();
   for(const[id,o]of recs(c)){seen.add(id);const h=hash(sj(o));if(snap[id]!==h){rows.push({coll:c,id:String(id),data:o,deleted:false});upd.push([c,String(id),h])}}
   for(const id in snap)if(!seen.has(id)){rows.push({coll:c,id,data:{},deleted:true});upd.push([c,id,null])}}
  for(let i=0;i<rows.length;i+=150)await cApi('/rest/v1/records?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+150))});
  for(const[c,id,h]of upd){if(h===null)delete DB.sync.snap[c][id];else DB.sync.snap[c][id]=h}
  if(rows.length)saveSync();
  CL.syncErr=''
 }catch(e){CL.syncErr=e.message}
 CL.pushing=false;
 if(CL.again){CL.again=false;schedPush()}}
function applyRec(r){
 const c=r.coll;if(!SYNC_SET.has(c))return false;
 const snap=DB.sync.snap[c]||(DB.sync.snap[c]={});
 if(c=='settings'){
  if(r.deleted)return false;
  const h=hash(sj(r.data));if(snap.main===h)return false;
  DB.settings={...DB.settings,...r.data};snap.main=h;CL.dirty.add('settings');return true}
 const arr=DB[c],key=c=='products'?'code':'id',id=String(r.id),i=arr.findIndex(o=>String(o[key])===id);
 if(r.deleted){if(i<0){delete snap[id];return false}arr.splice(i,1);delete snap[id];CL.dirty.add(c);return true}
 const h=hash(sj(r.data));
 if(i>=0){if(snap[id]===h)return false;if(hash(sj(arr[i]))===h){snap[id]=h;return false};arr[i]=r.data}
 else arr.push(r.data);
 snap[id]=h;CL.dirty.add(c);return true}
async function pullChanges(full){
 if(!cloudOn()||CL.pulling)return false;
 CL.pulling=true;let changed=false;
 try{
  let last=full?'1970-01-01T00:00:00Z':(DB.sync.last||'1970-01-01T00:00:00Z');
  for(;;){
   const rows=await cApi('/rest/v1/records?select=coll,id,data,deleted,updated_at&updated_at=gt.'+encodeURIComponent(last)+'&order=updated_at.asc&limit=500');
   if(!rows||!rows.length)break;
   for(const r of rows)if(applyRec(r))changed=true;
   last=rows[rows.length-1].updated_at;
   if(rows.length<500)break}
  DB.sync.last=last;saveSync();
  if(CL.dirty.size){saveLocal(...CL.dirty);CL.dirty.clear()}
  CL.syncErr=''
 }catch(e){CL.syncErr=e.message}
 CL.pulling=false;return changed}

function accTot(id){const o=CL.pend.find(x=>x.id==id);if(!o)return;const d=accDisc(o,+val('ad_v')||0,val('ad_t'));$('#ad_tot').innerHTML=`${d?`<div><span>${d<0?'تعديل العرض':'الخصم'}</span><span>${d<0?'+':'-'} ${n2(Math.abs(d))}</span></div>`:''}<div class="g"><span>الإجمالي بعد الخصم</span><span>${n2(o.subtotal-d+(+o.delivery||0))} ج</span></div>`}
async function doAccept(id,dv,dtype){
 closeModal();
 const o=CL.pend.find(x=>x.id==id);if(!o)return;
 if(syncOn())await pullChanges();
 let sale=DB.sales.find(s=>s.onlineId==o.id);
 if(!sale){
  const disc=accDisc(o,dv,dtype);
  const digits=String(o.phone).replace(/\D/g,'').slice(-10);
  let c=DB.customers.find(x=>String(x.phone||'').replace(/\D/g,'').slice(-10)===digits);
  if(!c){c={id:uid(),created:new Date().toISOString(),name:o.name,phone:o.phone,area:o.area||'',address:o.address||'',source:(DB.settings.sources.includes(srcName(o))?srcName(o):'موقع Diva'),notes:''};DB.customers.push(c);save('customers')}
  else{let ch=false;if(!c.area&&o.area){c.area=o.area;ch=true}if(!c.address&&o.address){c.address=o.address;ch=true}if(ch)save('customers')}
  const st=DB.settings;
  sale={id:uid(),no:await nextNo(),date:new Date().toISOString(),userId:S.user.id,userName:S.user.name,customerId:c.id,customerName:c.name,
   items:(o.items||[]).map(i=>{const p=prod(i.code);return{code:i.code,name:i.name,size:i.size||'',qty:i.qty,price:i.price,cost:p?(optCostText(p,optsOfItem(o,i))||p.cost):0,opts:optsOfItem(o,i)}}),
   subtotal:o.subtotal,discount:disc,delivery:+o.delivery||0,total:Math.round((o.subtotal-disc+(+o.delivery||0))*100)/100,pay:payMap(o.pay),
   note:['طلب موقع #'+o.no,o.pay_ref?'مرجع: '+o.pay_ref:'',o.notes||''].filter(Boolean).join(' | '),area:o.area||'',address:o.address||'',status:'ok',onlineId:o.id,src:srcName(o)};
  st.nextInvoice=sale.no+1;DB.sales.push(sale);
  for(const i of sale.items){const p=prod(i.code);if(p&&p.stock!=null){p.stock-=i.qty;DB.stocklog.push({date:sale.date,code:p.code,delta:-i.qty,reason:'طلب موقع #'+o.no,user:S.user.name})}}
  save('sales','products','settings','stocklog');schedSync()}
 try{
  await cApi('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'accepted',imported:true,sale_no:sale.no})});
  CL.pend=CL.pend.filter(x=>x.id!=o.id);toast('تم قبول الطلب وتسجيل فاتورة #'+sale.no);render();invModal(sale)
 }catch(e){toast('اتسجلت الفاتورة #'+sale.no+' لكن تحديث الموقع فشل: '+e.message+' — اضغط الزرار تاني')}}
async function rejectOrder(id){
 const o=CL.pend.find(x=>x.id==id);if(!o||!confirm(`رفض الطلب #${o.no}؟`))return;
 try{await cApi('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'rejected'})});
  CL.pend=CL.pend.filter(x=>x.id!=o.id);toast('تم رفض الطلب');render()}catch(e){toast('تعذّر: '+e.message)}}

function rb(){return `<div class="card row"><span>من</span><input type="date" value="${S.from}" onchange="S.from=this.value;go(S.page)" style="max-width:160px"><span>إلى</span><input type="date" value="${S.to}" onchange="S.to=this.value;go(S.page)" style="max-width:160px"><button class="btn s o" onclick="setR('d')">اليوم</button><button class="btn s o" onclick="setR('w')">آخر 7 أيام</button><button class="btn s o" onclick="setR('m')">الشهر</button><button class="btn s o" onclick="setR('a')">الكل</button></div>`}
function setR(k){const d=new Date();S.to=ymd(d);S.from=k=='d'?ymd(d):k=='w'?ymd(new Date(d-6*864e5)):k=='m'?ymd(new Date(d.getFullYear(),d.getMonth(),1)):'2000-01-01';go(S.page)}

/* ================= البيع ================= */
const cats=()=>{const a=new Set(DB.products.filter(p=>p.active).map(pcat));return catList().filter(c=>a.has(c))};
PAGE.pos=()=>{$('#main').innerHTML=`<div class="pos"><div><input id="q" placeholder="🔍 ابحث باسم المنتج أو الكود" value="${esc(S.q)}" oninput="S.q=this.value;drawGrid()"><div class="chips" id="chips"></div><div class="grid" id="pgrid"></div></div><div class="card cartbox" id="cart"></div></div>`;drawGrid();drawCart()};
function drawGrid(){
 const CLs=catList();
 $('#chips').innerHTML=['',...cats()].map(c=>`<a class="${S.cat==c?'on':''}" onclick="S.cat='${esc(c)}';drawGrid()">${c||'الكل'}${S.arr&&c?` <span onclick="event.stopPropagation();moveCatI(${CLs.indexOf(c)},-1)" title="قبل">▲</span> <span onclick="event.stopPropagation();moveCatI(${CLs.indexOf(c)},1)" title="بعد">▼</span>`:''}</a>`).join('')+`<a class="${S.arr?'on':''}" onclick="S.arr=!S.arr;drawGrid()">↕ ترتيب</a>`;
 const q=S.q.trim();
 const l=plist().filter(p=>p.active&&p.price>0&&(!S.cat||(p.cat||'أخرى')==S.cat)&&(!q||(p.name+' '+p.size+' '+p.code).includes(q)));
 $('#pgrid').innerHTML=l.map(p=>`<div class="pc ${p.stock!=null&&p.stock<=0?'out':''}" onclick="${S.arr?'':`addCart('${p.code}')`}">${S.arr?`<div style="display:flex;gap:4px;justify-content:center;margin-bottom:4px"><button class="btn s o" onclick="event.stopPropagation();moveProd('${p.code}',-1)">▲ قبل</button><button class="btn s o" onclick="event.stopPropagation();moveProd('${p.code}',1)">▼ بعد</button></div>`:''}<div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.size)}</div><div class="pp">${(+p.disc>0)?`<s class="mut" style="font-weight:400">${n2(p.price)}</s> `:''}${n2(ep(p))} ج${(+p.disc>0)?` <span class="bd">-${p.disc}%</span>`:''}</div>${p.stock!=null?`<div class="st ${lowOf(p)?'lw':''}">متاح: ${p.stock}</div>`:''}</div>`).join('')||'<p class="mut">مفيش منتجات</p>'}
/* ---- اختيارات المنتج في الكاشير ---- */
let PSEL=null;
const optGroupsP=p=>((p&&p.opts)||[]).map(g=>({...g,choices:(g.choices||[]).map(c=>typeof c=='string'?{label:c}:c).filter(c=>c&&c.label)})).filter(g=>g.name&&g.choices.length);
function lineP(i){const p=prod(i.code);if(!p)return 0;const s=i.sel||{};for(const g of optGroupsP(p)){const c=g.choices.find(c=>c.label===s[g.name]);if(c&&+c.price>0)return Math.round(c.price*(100-(+p.disc||0)))/100}return ep(p)}
function lineCost(i){const p=prod(i.code);if(!p)return 0;const s=i.sel||{};for(const g of optGroupsP(p)){const c=g.choices.find(c=>c.label===s[g.name]);if(c&&+c.cost>0)return +c.cost}return +p.cost||0}
function optCostText(p,t){for(const seg of String(t||'').split('، ')){const k=seg.indexOf(': ');if(k<0)continue;const g=optGroupsP(p).find(g=>g.name===seg.slice(0,k)),c=g&&g.choices.find(c=>c.label===seg.slice(k+2));if(c&&+c.cost>0)return +c.cost}return 0}
function lineOpts(i){const p=prod(i.code);if(!p)return '';const s=i.sel||{};return optGroupsP(p).map(g=>s[g.name]?g.name+': '+s[g.name]:'').filter(Boolean).join('، ')}
const lineKey=(c,sel)=>c+'|'+Object.keys(sel||{}).sort().map(k=>k+'='+sel[k]).join(';');
function cleanCart(){S.cart=S.cart.filter(i=>prod(i.code))}
function addCart(c,sel){const p=prod(c);if(!p)return toast('المنتج ده اتحذف');
 if(optGroupsP(p).length&&!sel){PSEL={c,sel:{}};modal(`<h3>${esc(p.name)} ${esc(p.size||'')}</h3><div id="posOpt"></div>`);posOptDraw();return}
 const k=lineKey(c,sel),i=S.cart.find(x=>x.k==k);i?i.qty++:S.cart.push({code:c,k,sel:sel||{},qty:1});drawCart()}
function posOptDraw(){const p=prod(PSEL.c),G=optGroupsP(p),sel=PSEL.sel,miss=G.filter(g=>g.req!==false&&!g.choices.some(c=>c.label===sel[g.name]));
 $('#posOpt').innerHTML=G.map((g,gi)=>`<div style="margin:10px 0"><b>${esc(g.name)}${g.req!==false?' <span style="color:#c00">*</span>':''}</b><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${g.choices.map((c,ci)=>`<button class="btn s ${sel[g.name]===c.label?'':'o'}" onclick="posPick(${gi},${ci})">${esc(c.label)}${+c.price>0?' — '+n2(c.price)+' ج':''}</button>`).join('')}</div></div>`).join('')+`<p class="mut">السعر: <b>${n2(lineP({code:PSEL.c,sel}))} ج</b></p><div class="row"><button class="btn" ${miss.length?'disabled style="opacity:.5"':''} onclick="posOptAdd()">${miss.length?'اختار '+esc(miss[0].name)+' الأول':'✔ إضافة للفاتورة'}</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`}
function posPick(gi,ci){if(!PSEL)return;const g=optGroupsP(prod(PSEL.c))[gi];if(g){PSEL.sel[g.name]=g.choices[ci].label;posOptDraw()}}
function posOptAdd(){if(!PSEL)return;const p=prod(PSEL.c);if(!p||optGroupsP(p).some(g=>g.req!==false&&!g.choices.some(c=>c.label===PSEL.sel[g.name])))return;const {c,sel}=PSEL;PSEL=null;closeModal();addCart(c,{...sel})}
function qty(ix,d){const i=S.cart[ix];if(!i)return;i.qty+=d;if(i.qty<=0)S.cart.splice(ix,1);drawCart()}
function clearCart(){S.cart=[];S.disc='';S.note='';S.cust='';S.area='';S.addr='';drawCart()}
function pickCust(id){S.cust=id;const c=cust(id);S.area=c?c.area||'':'';S.addr=c?c.address||'':'';drawCart()}
const areasList=()=>[...new Set([...DB.customers.map(c=>c.area),...DB.sales.map(s=>s.area)].filter(Boolean))];
function totals(){const sub=S.cart.reduce((a,i)=>a+lineP(i)*i.qty,0);let d=S.dtype=='pct'?sub*(+S.disc||0)/100:(+S.disc||0);d=Math.min(Math.max(d,0),sub);return{sub,d,total:sub-d}}
function drawCart(){
 cleanCart();
 const pays=DB.settings.pays;if(!S.pay||!pays.includes(S.pay))S.pay=pays[0];
 const cs=[...DB.customers].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('#cart').innerHTML=`<h3>🧾 الفاتورة</h3><div class="items">${S.cart.map((i,ix)=>{const p=prod(i.code);return `<div class="ci"><div class="cn">${esc(p.name)} <small class="mut">${esc(p.size)}</small>${lineOpts(i)?'<br><small style="color:#5e4936">'+esc(lineOpts(i))+'</small>':''}<br><small class="mut">${n2(lineP(i))} ج</small></div><div class="qty"><button onclick="qty(${ix},-1)">−</button><b>${i.qty}</b><button onclick="qty(${ix},1)">+</button></div><div class="ct">${n2(lineP(i)*i.qty)}</div><a onclick="qty(${ix},-9999)">✕</a></div>`}).join('')||'<p class="mut">اضغط على منتج لإضافته</p>'}</div>
 <label>العميل</label><div class="row"><select onchange="pickCust(this.value)"><option value="">— بدون عميل —</option>${cs.map(c=>`<option value="${c.id}" ${S.cust==c.id?'selected':''}>${esc(c.name)} ${esc(c.phone||'')}</option>`).join('')}</select><button class="btn o s" onclick="custModal(null,true)">+ جديد</button></div>
 <div class="row"><div style="flex:1"><label>المنطقة</label><input list="arl" value="${esc(S.area)}" oninput="S.area=this.value"><datalist id="arl">${areasList().map(a=>`<option value="${esc(a)}">`).join('')}</datalist></div><div style="flex:2"><label>العنوان</label><input value="${esc(S.addr)}" oninput="S.addr=this.value"></div></div>
 ${can('discount')?`<label>الخصم</label><div class="row"><input type="number" min="0" value="${esc(S.disc)}" oninput="S.disc=this.value;drawTotals()"><select style="max-width:80px" onchange="S.dtype=this.value;drawTotals()"><option value="amt" ${S.dtype=='amt'?'selected':''}>ج</option><option value="pct" ${S.dtype=='pct'?'selected':''}>%</option></select></div>`:''}
 <label>طريقة الدفع</label><select onchange="S.pay=this.value">${pays.map(x=>`<option ${S.pay==x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <label>ملاحظة</label><input value="${esc(S.note)}" oninput="S.note=this.value">
 <div class="tot" id="tot"></div><button class="btn big" onclick="checkout()">✔ إتمام البيع</button><button class="btn g" style="width:100%;margin-top:6px" onclick="clearCart()">مسح الفاتورة</button>`;
 drawTotals()}
function drawTotals(){const t=totals();$('#tot').innerHTML=`<div><span>المجموع</span><span>${n2(t.sub)}</span></div>${t.d?`<div><span>الخصم</span><span>- ${n2(t.d)}</span></div>`:''}<div class="g"><span>الإجمالي</span><span>${n2(t.total)} ج</span></div>`}
async function checkout(){
 cleanCart();if(!S.cart.length)return toast('الفاتورة فاضية');
 if(S.busy)return;S.busy=true;
 const t=totals(),c=cust(S.cust),st=DB.settings;
 const no=await nextNo();S.busy=false;
 if(!S.cart.length)return;
 st.nextInvoice=no+1;
 const sale={id:uid(),no,date:new Date().toISOString(),userId:S.user.id,userName:S.user.name,customerId:c?c.id:'',customerName:c?c.name:'',
  items:S.cart.map(i=>{const p=prod(i.code);return{code:p.code,name:p.name,size:p.size,qty:i.qty,price:lineP(i),cost:lineCost(i),opts:lineOpts(i)}}),
  subtotal:t.sub,discount:t.d,total:t.total,pay:S.pay,note:S.note,area:S.area.trim(),address:S.addr.trim(),status:'ok'};
 if(c){let ch=false;if(!c.area&&sale.area){c.area=sale.area;ch=true}if(!c.address&&sale.address){c.address=sale.address;ch=true}if(ch)save('customers')}
 DB.sales.push(sale);
 for(const i of sale.items){const p=prod(i.code);if(p&&p.stock!=null){p.stock-=i.qty;DB.stocklog.push({date:sale.date,code:p.code,delta:-i.qty,reason:'بيع #'+sale.no,user:S.user.name})}}
 save('sales','products','settings','stocklog');schedSync();
 S.cart=[];S.disc='';S.note='';S.cust='';S.area='';S.addr='';
 drawCart();drawGrid();invModal(sale);
 if(st.autoPrint)setTimeout(()=>doPrint(),600)}

function invHTML(s,paper){
 const st=DB.settings,a4=paper==='a4';
 const css=`@page{size:${a4?'A4':'80mm auto'};margin:${a4?'12mm':'0'}}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;direction:rtl;margin:0;color:#000;font-size:${a4?'14px':'12px'};${a4?'':'width:80mm;padding:4mm'}}.c{text-align:center}h2{margin:2px 0}table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:${a4?'7px':'3px 2px'};text-align:right;border-bottom:1px ${a4?'solid #ccc':'dashed #000'};vertical-align:top}th{${a4?'background:#f3f3f3':''}}.n{text-align:left;white-space:nowrap}.t{display:flex;justify-content:space-between;padding:2px 0}.g{font-size:${a4?'18px':'15px'};font-weight:bold;border-top:2px solid #000;margin-top:4px;padding-top:4px}.x{color:#c00;font-size:20px;font-weight:bold;text-align:center;border:2px solid #c00;margin:6px 0}img{max-height:${a4?'80px':'55px'};max-width:60%}`;
 return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${s.no}</title><style>${css}</style></head><body><div class="c">${st.logo?`<img src="${st.logo}"><br>`:''}<h2>${esc(st.shopName)}</h2>${st.phone?`<div>${esc(st.phone)}</div>`:''}${st.address?`<div>${esc(st.address)}</div>`:''}</div><hr>${s.status=='cancelled'?'<div class="x">ملغاة</div>':''}<div class="t"><span>فاتورة رقم: <b>${s.no}</b></span><span>${dt(s.date)}</span></div><div class="t"><span>الكاشير: ${esc(s.userName)}</span>${s.customerName?`<span>العميل: ${esc(s.customerName)}</span>`:''}</div>${s.area||s.address?`<div>العنوان: ${esc([s.area,s.address].filter(Boolean).join(' - '))}</div>`:''}<table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th class="n">الإجمالي</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)} ${esc(i.size)}${i.opts?' <small>('+esc(i.opts)+')</small>':''}</td><td>${i.qty}</td><td>${n2(i.price)}</td><td class="n">${n2(i.price*i.qty)}</td></tr>`).join('')}</table><div class="t"><span>المجموع</span><span>${n2(s.subtotal)}</span></div>${s.discount?`<div class="t"><span>الخصم</span><span>- ${n2(s.discount)}</span></div>`:''}${s.delivery?`<div class="t"><span>التوصيل</span><span>${n2(s.delivery)}</span></div>`:''}<div class="t g"><span>الإجمالي</span><span>${n2(s.total)} ج</span></div><div class="t"><span>طريقة الدفع</span><span>${esc(s.pay)}</span></div>${s.note?`<div>ملاحظة: ${esc(s.note)}</div>`:''}<hr><div class="c">${esc(st.footer)}</div></body></html>`}
function printHTML(html,title){
 const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();
 setTimeout(()=>{const old=document.title;if(title)document.title=title;f.contentWindow.focus();f.contentWindow.print();document.title=old;setTimeout(()=>f.remove(),60000)},500)}
function invModal(s,paper){paper=paper||DB.settings.paper;S.invId=s.id;
 modal(`<h3>فاتورة #${s.no}</h3><div class="row"><select id="pp" style="max-width:150px" onchange="invModal(DB.sales.find(x=>x.id==S.invId),this.value)"><option value="80" ${paper=='80'?'selected':''}>حراري 80mm</option><option value="a4" ${paper=='a4'?'selected':''}>A4</option></select><button class="btn" onclick="doPrint()">🖨️ طباعة</button><button class="btn o" onclick="doPrint(1)">📄 حفظ PDF</button><button class="btn o" onclick="waInv()">💬 واتساب</button></div><iframe class="pv" srcdoc="${esc(invHTML(s,paper))}"></iframe><button class="btn g" onclick="closeModal()">إغلاق</button>`,true)}
function showInv(id){invModal(DB.sales.find(x=>x.id==id))}
function doPrint(pdf){const s=DB.sales.find(x=>x.id==S.invId);if(!s)return;if(pdf)toast('في نافذة الطباعة اختار الوجهة: Save as PDF');printHTML(invHTML(s,$('#pp')?$('#pp').value:DB.settings.paper),'فاتورة '+s.no)}
function waText(s){return `*${DB.settings.shopName}*\nفاتورة رقم ${s.no}\n${dt(s.date)}\n\n`+s.items.map(i=>`• ${i.name} ${i.size}${i.opts?' ('+i.opts+')':''} × ${i.qty} = ${n2(i.price*i.qty)}`).join('\n')+(s.discount?`\nخصم: ${n2(s.discount)}`:'')+(s.delivery?`\nتوصيل: ${n2(s.delivery)}`:'')+`\n*الإجمالي: ${n2(s.total)} ج*\n\n${DB.settings.footer}`}
function waSend(phone,text){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=DB.settings.cc+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank')}
function waInv(){const s=DB.sales.find(x=>x.id==S.invId),c=cust(s.customerId);waSend(c&&c.phone,waText(s))}

function drawInv(){const q=S.iq.trim();

 s.status='cancelled';s.cancelledBy=S.user.name;
 for(const i of s.items){const p=prod(i.code);if(p&&p.stock!=null){p.stock+=i.qty;DB.stocklog.push({date:new Date().toISOString(),code:p.code,delta:i.qty,reason:'إلغاء #'+s.no,user:S.user.name})}}

 $('#main').innerHTML=`<div class="row"><button class="btn" onclick="prodModal()">+ منتج جديد</button><button class="btn o" onclick="prodXlsx()">Excel</button><button class="btn o" onclick="syncProducts(true)">☁️ رفع المنتجات للموقع</button><label style="margin-inline-start:8px"><input type="checkbox" onchange="selAll(this.checked)"> تحديد الكل</label></div><div id="selBar" class="row" style="display:none;align-items:center;gap:8px;position:sticky;top:0;z-index:5;background:#fff;padding:8px;border:2px solid #5e4936;border-radius:10px;margin:8px 0"><span>المحدد: <b>0</b></span><button class="btn s o" onclick="bulkMove(-1)">▲ فوق</button><button class="btn s o" onclick="bulkMove(1)">▼ تحت</button><button class="btn s o" onclick="bulkMoveCat()">📁 نقل لتصنيف</button><button class="btn s r" onclick="bulkDelete()">🗑 حذف المحدد</button><button class="btn s g" onclick="PSELS.clear();prodRR()">إلغاء التحديد</button></div>${lw.length?`<div class="banner" style="border-radius:8px;margin-bottom:10px">⚠️ مخزون منخفض: ${lw.map(p=>esc(p.name+' '+p.size)+' ('+p.stock+')').join('، ')}</div>`:''}<div class="card tw"><table><tr><th></th><th>ترتيب</th><th>صورة</th><th>الكود</th><th>المنتج</th><th>الحجم</th><th>السعر</th><th>التكلفة</th><th>الهامش</th><th>المخزون</th><th>نشط</th><th></th></tr>${body}</table></div>`;selBarDraw()};

/* ===== ترتيب المنتجات والتصنيفات: ثابت ومتزامن (مش بيعتمد على مكان المنتج في القائمة) ===== */
const pcat=p=>p.cat||'أخرى';
const PSELS=new Set();
let INORD=false;
function ensureOrd(){if(INORD)return;INORD=true;try{ensureOrd2()}finally{INORD=false}}
function ensureOrd2(){
 const byCode=(a,b)=>(+String(a.code).slice(1)||0)-(+String(b.code).slice(1)||0);
 const miss=DB.products.filter(p=>typeof p.ord!='number'||p.ordCat!==pcat(p));
 if(!miss.length)return;
 const mx=c=>Math.max(0,...DB.products.filter(x=>typeof x.ord=='number'&&x.ordCat===c&&pcat(x)===c&&x!==undefined&&!miss.includes(x)).map(x=>x.ord));
 if(DB.products.every(p=>typeof p.ord!='number')){[...DB.products].sort(byCode).forEach((p,i)=>{p.ord=(i+1)*10;p.ordCat=pcat(p)})}
 else miss.sort(byCode).forEach(p=>{p.ord=mx(pcat(p))+10;p.ordCat=pcat(p)});
 const aft=DB.products.filter(p=>p._after);
 for(const p of aft){const t=prod(p._after);delete p._after;
  if(t&&pcat(t)===pcat(p)){p.ord=t.ord+0.5;const g=DB.products.filter(x=>pcat(x)===pcat(p)).sort((a,b)=>a.ord-b.ord);g.forEach((x,i)=>x.ord=(i+1)*10)}}
 DB.settings.catOrder=catList();
 save('products','settings')}
function minOrd(c){return Math.min(...DB.products.filter(p=>pcat(p)===c).map(p=>typeof p.ord=='number'?p.ord:1e9))}
function catList(){ensureOrd();const present=new Set(DB.products.map(pcat)),out=(DB.settings.catOrder||[]).filter(c=>present.has(c));
 return [...out,...[...present].filter(c=>!out.includes(c)).sort((a,b)=>minOrd(a)-minOrd(b))]}
function plist(){ensureOrd();const ci=new Map(catList().map((c,i)=>[c,i]));
 return [...DB.products].sort((a,b)=>ci.get(pcat(a))-ci.get(pcat(b))||a.ord-b.ord||String(a.code).localeCompare(b.code))}
const ordGrp=c=>plist().filter(p=>pcat(p)===c);
function prodRR(){const y=scrollY;if(S.page=='pos')drawGrid();else{render();scrollTo(0,y)}}
function afterOrder(sett){save('products');if(sett)save('settings');schedSync();prodRR()}
function moveProd(code,d){const p=prod(code);if(!p)return;const g=ordGrp(pcat(p)),i=g.indexOf(p),j=i+d;if(j<0||j>=g.length)return;[g[i].ord,g[j].ord]=[g[j].ord,g[i].ord];afterOrder()}
function moveCatI(i,d){const L=catList(),j=i+d;if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];DB.settings.catOrder=L;afterOrder(true)}
function addInCat(i){prodModal('',catList()[i])}
function togSel(code,on){on?PSELS.add(code):PSELS.delete(code);selBarDraw()}
function togCatI(i,on){ordGrp(catList()[i]).forEach(p=>on?PSELS.add(p.code):PSELS.delete(p.code));prodRR()}
function selAll(on){DB.products.forEach(p=>on?PSELS.add(p.code):PSELS.delete(p.code));prodRR()}
function selBarDraw(){const b=$('#selBar');if(!b)return;b.style.display=PSELS.size?'flex':'none';b.querySelector('b').textContent=PSELS.size}
function bulkMove(d){if(!PSELS.size)return;
 for(const c of catList()){const L=ordGrp(c),arr=[...L],sel=p=>PSELS.has(p.code);if(!L.some(sel))continue;
  if(d<0){for(let i=1;i<arr.length;i++)if(sel(arr[i])&&!sel(arr[i-1]))[arr[i-1],arr[i]]=[arr[i],arr[i-1]]}
  else{for(let i=arr.length-2;i>=0;i--)if(sel(arr[i])&&!sel(arr[i+1]))[arr[i+1],arr[i]]=[arr[i],arr[i+1]]}
  const ords=L.map(p=>p.ord);arr.forEach((p,i)=>p.ord=ords[i])}
 afterOrder()}
function bulkMoveCat(){if(!PSELS.size)return;
 modal(`<h3>نقل ${PSELS.size} منتج لتصنيف</h3><label>اسم التصنيف (اختار من الموجود أو اكتب جديد)</label><input id="mv_cat" list="cl2"><datalist id="cl2">${catList().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="row" style="margin-top:12px"><button class="btn" onclick="bulkMoveCatDo()">نقل</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`)}
function bulkMoveCatDo(){const name=val('mv_cat');if(!name)return toast('اكتب اسم التصنيف');
 const sel=plist().filter(p=>PSELS.has(p.code));let mx=Math.max(0,...DB.products.filter(p=>pcat(p)===name&&!PSELS.has(p.code)).map(p=>p.ord||0));
 sel.forEach(p=>{p.cat=name;mx+=10;p.ord=mx;p.ordCat=name});
 const L=catList();if(!(DB.settings.catOrder||[]).includes(name))DB.settings.catOrder=[...(DB.settings.catOrder||[]).filter(c=>L.includes(c)),name];
 PSELS.clear();closeModal();afterOrder(true);toast('تم النقل')}
async function cloudDelProd(code){if(!cloudOn())return;const u='/rest/v1/products?code=eq.'+encodeURIComponent(code);
 try{await cApi(u,{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(e){try{await cApi(u,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:false})})}catch(e2){toast('فشل حذف '+code+' من الموقع: '+e.message)}}}
async function bulkDelete(){const codes=[...PSELS];if(!codes.length)return;
 if(!confirm(`حذف ${codes.length} منتج نهائيًا؟\nالفواتير القديمة مش هتتأثر، والمنتجات هتتشال من الكاشير ومن الموقع.`))return;
 DB.settings.prodMax=Math.max(DB.settings.prodMax||0,...codes.map(c=>+String(c).slice(1)||0));
 DB.products=DB.products.filter(x=>!PSELS.has(x.code));if(Array.isArray(S.cart))S.cart=S.cart.filter(x=>!PSELS.has(x.code));
 PSELS.clear();save('products','settings');for(const c of codes)await cloudDelProd(c);
 schedPush();prodRR();toast('تم حذف '+codes.length+' منتج')}
const mgOf=(pr,co)=>(+pr>0&&+co>0)?Math.round((pr-co)/pr*1000)/10:'';
const chSum=p=>optGroupsP(p).map(g=>g.choices.map(c=>{const m=(+c.price>0&&+c.cost>0)?Math.round((c.price-c.cost)/c.price*100)+'%':'';return `<div class="mut" style="font-size:11px">${esc(g.name)}: ${esc(c.label)}${+c.price>0?' — '+n2(c.price):''}${+c.cost>0?' / تكلفة '+n2(c.cost):''}${m?' ('+m+')':''}</div>`}).join('')).join('');
function baseCalc(f){const P=$('#f_price'),C=$('#f_cost'),M=$('#f_mg'),pr=+P.value,co=+C.value,m=M.value===''?null:+M.value;
 if(f=='m'&&m!==null&&m<100){if(co>0)P.value=Math.round(co/(1-m/100)*100)/100;else if(pr>0)C.value=Math.round(pr*(1-m/100)*100)/100}else if(f!='m')M.value=mgOf(+P.value,+C.value)}
let PROD_AFTER=null;
function prodAddAfter(code){const p=prod(code);prodModal('',p?p.cat:'',code)}
function prodModal(code,cat0,after){PROD_AFTER=after||null;const p=code?prod(code):{code:'',name:'',size:'',price:'',cost:'',stock:null,min:null,active:true,cat:cat0||''};
 OPT=JSON.parse(JSON.stringify(p.opts||[])).map(g=>({...g,choices:(Array.isArray(g.choices)?g.choices:[]).map(c=>typeof c=='string'?{label:c}:{...c})}));
 modal(`<h3>${code?'تعديل منتج '+code:'منتج جديد'}</h3><label>اسم المنتج</label><input id="f_name" value="${esc(p.name)}"><div class="row"><div style="flex:1"><label>الحجم / النوع</label><input id="f_size" value="${esc(p.size)}"></div><div style="flex:1"><label>التصنيف</label><input id="f_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(DB.products.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div><div class="row"><div style="flex:1"><label>سعر البيع</label><input id="f_price" type="number" value="${p.price}" oninput="baseCalc('p')"></div><div style="flex:1"><label>التكلفة</label><input id="f_cost" type="number" value="${p.cost}" oninput="baseCalc('c')"></div><div style="flex:1"><label>هامش %</label><input id="f_mg" type="number" value="${mgOf(p.price,p.cost)}" oninput="baseCalc('m')"></div></div><div class="row"><div style="flex:1"><label>خصم % على المنتج (اختياري — بيظهر في الموقع والكاشير)</label><input id="f_disc" type="number" min="0" max="99" value="${p.disc||''}"></div></div><div class="row"><div style="flex:1"><label>المخزون (فاضي = غير متابع)</label><input id="f_stock" type="number" value="${p.stock??''}"></div><div style="flex:1"><label>حد التنبيه (فاضي = الافتراضي)</label><input id="f_min" type="number" value="${p.min??''}"></div></div><label>وصف المنتج (يظهر للعميل لما يفتح المنتج — فاضي = بدون وصف)</label><textarea id="f_desc" rows="3">${esc(p.desc||'')}</textarea><label>أقسام الاختيارات (اختيارية — العميل لازم يختار من كل قسم إجباري)</label><div id="optBox"></div><label>صورة المنتج (بتظهر في صفحة الطلب)</label><div class="row">${p.img?`<img class="thumb" src="${esc(p.img)}" alt="">`:''}<input type="file" id="f_img" accept="image/*"></div><label><input type="checkbox" id="f_act" ${p.active?'checked':''}> نشط (يظهر في البيع وفي الموقع)</label><div class="row" style="margin-top:12px"><button class="btn" id="svp" onclick="saveProd('${code||''}')">حفظ</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`);optDraw()}
let OPT=[];
function optDraw(){const b=$('#optBox');if(!b)return;
 b.innerHTML=OPT.map((g,i)=>`<div class="card" style="background:#0000000a"><div class="row"><div style="flex:1"><label>اسم القسم (مثال: الوزن)</label><input value="${esc(g.name||'')}" oninput="OPT[${i}].name=this.value"></div><button class="btn s r" onclick="optDel(${i})">حذف القسم</button></div><div class="mut" style="font-size:12px">كل اختيار (وزن/نوع) له سعره وتكلفته وهامشه لوحده. السعر = سعر المنتج كامل. التكلفة والهامش للإدارة بس ومش بيظهروا للعملاء. فاضي = بياخد سعر/تكلفة المنتج الأساسية.</div>${(g.choices||[]).map((c,j)=>`<div class="row" style="align-items:flex-end;gap:6px"><div style="flex:2;min-width:110px"><label>الاختيار</label><input value="${esc(c.label||'')}" oninput="OPT[${i}].choices[${j}].label=this.value"></div><div style="flex:1;min-width:70px"><label>السعر</label><input id="ch_${i}_${j}_p" type="number" min="0" value="${c.price??''}" oninput="chCalc(${i},${j},'p',this.value)"></div><div style="flex:1;min-width:70px"><label>التكلفة</label><input id="ch_${i}_${j}_c" type="number" min="0" value="${c.cost??''}" oninput="chCalc(${i},${j},'c',this.value)"></div><div style="flex:1;min-width:70px"><label>هامش %</label><input id="ch_${i}_${j}_m" type="number" value="${mgOf(c.price,c.cost)}" oninput="chCalc(${i},${j},'m',this.value)"></div><button class="btn s r" onclick="chDel(${i},${j})">✕</button></div>`).join('')}<button class="btn s o" onclick="chAdd(${i})">+ اختيار</button><label><input type="checkbox" ${g.req!==false?'checked':''} onchange="OPT[${i}].req=this.checked"> إجباري (العميل لازم يختار)</label></div>`).join('')+(OPT.length<6?'<button class="btn o" onclick="optAdd()">+ قسم اختيارات</button>':'')}
function chCalc(i,j,f,v){const c=OPT[i].choices[j],n=v===''?'':+v,E=k=>$('#ch_'+i+'_'+j+'_'+k);
 if(f=='p')c.price=n;else if(f=='c')c.cost=n;
 else if(n!==''&&n<100){if(c.cost>0){c.price=Math.round(c.cost/(1-n/100)*100)/100;E('p').value=c.price}else if(c.price>0){c.cost=Math.round(c.price*(1-n/100)*100)/100;E('c').value=c.cost}}
 if(f!='m')E('m').value=mgOf(c.price,c.cost)}
function chAdd(i){OPT[i].choices.push({label:'',price:'',cost:''});optDraw()}
function chDel(i,j){OPT[i].choices.splice(j,1);optDraw()}
function optPriceOk(p,v){const d=+p.disc||0,ok=x=>Math.abs(x-v)<0.011;return ok(+p.price)||(p.opts||[]).some(g=>(g.choices||[]).some(c=>+c.price>0&&(ok(+c.price)||ok(Math.round(c.price*(100-d))/100))))}
function optsOfItem(o,i){const om=(String(o.notes||'').match(/خيارات:\s*([^|]+)/)||[])[1]||'',key=(i.name+(i.size?' '+i.size:'')).trim();for(const sg of om.split(' ؛ ')){const t=sg.trim();if(t.startsWith(key+' (')&&t.endsWith(')'))return t.slice(key.length+2,-1)}return ''}
function optAdd(){OPT.push({name:'',req:true,choices:[{label:'',price:'',cost:''}]});optDraw()}
function optDel(i){OPT.splice(i,1);optDraw()}
function optCollect(){const out=[];for(const g of OPT){const name=String(g.name||'').trim(),seen=new Set(),ch=[];
 for(const c of (g.choices||[])){const label=String(c.label||'').trim();if(!label||seen.has(label))continue;seen.add(label);const o={label};if(+c.price>0)o.price=+c.price;if(+c.cost>0)o.cost=+c.cost;ch.push(o)}
 if(!name&&!ch.length)continue;if(!name||!ch.length)return null;out.push({name,req:g.req!==false,choices:ch})}return out}
async function saveProd(code){const name=val('f_name'),price=+val('f_price'),cost=+val('f_cost'),disc=val('f_disc')===''?0:+val('f_disc');
 if(!name||!(price>0))return toast('اكتب الاسم وسعر البيع');
 if(!(disc>=0&&disc<100))return toast('الخصم لازم يكون بين 0 و 99');
 const opts=optCollect();if(opts===null)return toast('كل قسم اختيارات لازم يكون له اسم واختيار واحد على الأقل');
 const file=$('#f_img')&&$('#f_img').files[0];
 if(file&&!cloudOn())return toast('اربط الموقع الأول من الإعدادات عشان ترفع الصورة');
 let p=code?prod(code):null;
 if(!p){const mx=Math.max(DB.settings.prodMax||0,...DB.products.map(x=>+x.code.slice(1)||0));p={code:'P'+p2(mx+1)};if(PROD_AFTER)p._after=PROD_AFTER;DB.products.push(p)}
 const ns=val('f_stock')===''?null:+val('f_stock');
 if(ns!==p.stock&&ns!=null)DB.stocklog.push({date:new Date().toISOString(),code:p.code,delta:ns-(p.stock||0),reason:'تعديل يدوي',user:S.user.name});
 Object.assign(p,{desc:val('f_desc'),opts,name,size:val('f_size'),cat:val('f_cat')||catOf(name),price,cost,disc,stock:ns,min:val('f_min')===''?null:+val('f_min'),active:$('#f_act').checked});
 save('products','stocklog');
 if(file){const b=$('#svp');if(b){b.disabled=true;b.textContent='جاري رفع الصورة...'}
  try{p.img=await uploadImg('products/'+p.code+'.jpg',await toJpeg(file,800,.82));save('products')}catch(e){toast('اتحفظ المنتج لكن الصورة فشلت: '+e.message)}}
 schedSync();closeModal();go('products')}
async function delProd(code){const p=prod(code);if(!p)return;
 if(!confirm(`حذف «${p.name} ${p.size||''}» نهائيًا؟\nالفواتير القديمة مش هتتأثر، والمنتج هيتشال من الكاشير ومن الموقع.`))return;
 DB.settings.prodMax=Math.max(DB.settings.prodMax||0,+String(code).slice(1)||0);
 DB.products=DB.products.filter(x=>x.code!=code);
 if(Array.isArray(S.cart))S.cart=S.cart.filter(x=>x.code!=code);

function repData(){
 const ss=salesIn().filter(s=>s.status!='cancelled'),ex=DB.expenses.filter(e=>e.date>=S.from&&e.date<=S.to);
 const P=new Map(),D=new Map(),Y=new Map(),Sr=new Map(),U=new Map(),A=new Map();
 const add=(m,k,rev,cost,n)=>{const o=m.get(k)||{k,rev:0,cost:0,n:0,q:0};o.rev+=rev;o.cost+=cost;o.n+=n;m.set(k,o);return o};
 for(const s of ss){const f=s.subtotal?(s.total-(s.delivery||0))/s.subtotal:1,c=cust(s.customerId),cost=s.items.reduce((a,i)=>a+i.cost*i.qty,0);
  add(D,ymd(s.date),s.total,cost,1);add(Y,s.pay,s.total,cost,1);add(Sr,(c&&c.source)||(c?'غير محدد':'بدون عميل'),s.total,cost,1);add(U,s.userName,s.total,cost,1);add(A,s.area||(c&&c.area)||'غير محدد',s.total,cost,1);
  for(const i of s.items){const o=add(P,i.name+' '+i.size+(i.opts?' ('+i.opts+')':''),i.price*i.qty*f,i.cost*i.qty,0);o.q+=i.qty}}
 const rev=ss.reduce((a,s)=>a+s.total,0),cogs=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),exp=ex.reduce((a,e)=>a+e.amount,0);
 const arr=(m,sortF)=>[...m.values()].sort(sortF);
 return{ss,ex,rev,cogs,gross:rev-cogs,exp,net:rev-cogs-exp,prod:arr(P,(a,b)=>b.rev-a.rev),day:arr(D,(a,b)=>a.k.localeCompare(b.k)),pay:arr(Y,(a,b)=>b.rev-a.rev),src:arr(Sr,(a,b)=>b.rev-a.rev),usr:arr(U,(a,b)=>b.rev-a.rev),area:arr(A,(a,b)=>b.rev-a.rev)}}
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mut">لا توجد بيانات</td></tr>`}</table></div>`;

 $('#main').innerHTML=rb()+`<div class="row"><button class="btn" onclick="repXlsx()">⬇️ Excel</button><button class="btn o" onclick="repPdf()">📄 PDF / طباعة</button></div><div id="rep"><h3>تقرير ${S.from} إلى ${S.to}</h3><div class="kpis"><div class="kpi"><b>${r.ss.length}</b>فواتير</div><div class="kpi"><b>${n2(r.rev)}</b>المبيعات</div><div class="kpi"><b>${n2(r.cogs)}</b>التكلفة</div><div class="kpi ${r.gross>=0?'pos':'neg'}"><b>${n2(r.gross)}</b>مجمل الربح</div><div class="kpi"><b>${n2(r.exp)}</b>المصروفات</div><div class="kpi ${r.net>=0?'pos':'neg'}"><b>${n2(r.net)}</b>صافي الربح</div></div>
 <div class="card"><b>المنتجات (الأكثر مبيعًا)</b>${tbl(['المنتج','الكمية','المبيعات','الربح'],r.prod.map(o=>[esc(o.k),o.q,n2(o.rev),n2(o.rev-o.cost)]))}</div>
 <div class="card"><b>حسب اليوم</b>${tbl(['اليوم','الفواتير','المبيعات','الربح'],r.day.map(o=>[o.k,o.n,n2(o.rev),n2(o.rev-o.cost)]))}</div>
 <div class="card"><b>طرق الدفع</b>${tbl(['الطريقة','الفواتير','المبيعات'],r.pay.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>مصدر العميل</b>${tbl(['المصدر','الفواتير','المبيعات'],r.src.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>المناطق</b>${tbl(['المنطقة','الفواتير','المبيعات'],r.area.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>الكاشير</b>${tbl(['المستخدم','الفواتير','المبيعات'],r.usr.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>المصروفات</b>${tbl(['البند','المبلغ','التاريخ','ملاحظة'],r.ex.map(e=>[esc(e.cat),n2(e.amount),e.date,esc(e.note||'')]))}</div></div>`};

  {name:'مصدر العميل',rows:[['المصدر','الفواتير','المبيعات'],...r.src.map(o=>[o.k,o.n,o.rev])]},
  {name:'المناطق',rows:[['المنطقة','الفواتير','المبيعات'],...r.area.map(o=>[o.k,o.n,o.rev])]},

/* ===== رفع صورة/فيديو الهيرو (Supabase Storage: bucket اسمه site-media) ===== */
const waitEv=(el,ev)=>new Promise((ok,no)=>{el.addEventListener(ev,ok,{once:true});el.addEventListener('error',()=>no(new Error('الملف مش مدعوم أو بايظ')),{once:true})});
const mediaBase=()=>cfg().url.replace(/\/$/,'')+'/storage/v1/object/';
async function upMedia(blob,name,type){
 const t=await cTok(),c=cfg(),r=await fetch(mediaBase()+'site-media/'+name,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':type,'x-upsert':'true','cache-control':'max-age=31536000'},body:blob});
 if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(/bucket|not found|policy|row-level/i.test(m)?'شغّل ملف supabase-media.sql مرة واحدة في Supabase':(m||'فشل الرفع '+r.status))}
 return mediaBase()+'public/site-media/'+name}
async function delMedia(url){try{const n=String(url||'').split('/site-media/')[1];if(!n)return;const t=await cTok(),c=cfg();await fetch(mediaBase()+'site-media/'+n,{method:'DELETE',headers:{apikey:c.key,Authorization:'Bearer '+t}})}catch(e){}}
async function prepImage(file){
 if(/gif|svg/.test(file.type)){if(file.size>8*1048576)throw new Error('الصورة أكبر من 8 ميجا');return{blob:file,type:file.type,ext:file.type.includes('gif')?'gif':'svg'}}
 const bmp=await createImageBitmap(file),k=Math.min(1,1920/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
 c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/webp',.88));return{blob,type:'image/webp',ext:'webp'}}
async function prepVideo(file,say,force){
 const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
 await waitEv(v,'loadedmetadata');if(v.duration===Infinity){v.currentTime=1e101;await new Promise(r=>{const t=setTimeout(r,2500);v.addEventListener('timeupdate',()=>{clearTimeout(t);r()},{once:true})});v.currentTime=0}
 const dur=v.duration,W=v.videoWidth,H=v.videoHeight;
 if(!(dur>0)||!W)throw new Error('مش قادر أقرا الفيديو');
 if(dur>45)throw new Error('الفيديو أطول من 45 ثانية. قصّره (الأفضل 5–15 ثانية) عشان الموقع يفضل خفيف.');
 v.currentTime=Math.min(0.3,dur/3);await waitEv(v,'seeked');
 const ps=Math.min(1,1280/Math.max(W,H)),pc=document.createElement('canvas');pc.width=Math.round(W*ps);pc.height=Math.round(H*ps);pc.getContext('2d').drawImage(v,0,0,pc.width,pc.height);
 const poster=await new Promise(r=>pc.toBlob(r,'image/jpeg',.82)),okType=/^video\/(mp4|webm)/.test(file.type),orig={blob:file,type:(file.type||'video/mp4').split(';')[0],ext:/webm/.test(file.type)?'webm':'mp4',poster};
 if(okType&&file.size<=12*1048576&&!force){URL.revokeObjectURL(url);return{...orig,note:'الفيديو خفيف أصلًا فاترفع بجودته الأصلية'}}
 const mime=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
 if(!mime){if(file.size>25*1048576)throw new Error('الفيديو تقيل ('+Math.round(file.size/1048576)+' ميجا) والمتصفح ده مش بيضغط. جرّب كروم أو صغّره.');return{...orig,note:'المتصفح مش بيدعم الضغط، اترفع الأصلي'}}
 const cap=Math.min(1,1920/Math.max(W,H)),cw=Math.max(2,Math.round(W*cap/2)*2),ch=Math.max(2,Math.round(H*cap/2)*2),cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d');
 const bps=Math.round(Math.min(5e6,Math.max(1.8e6,cw*ch*30*0.07))),rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:bps}),chunks=[];
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(ok=>rec.onstop=ok);
 v.currentTime=0;await new Promise(r=>{const t=setTimeout(r,800);v.addEventListener('seeked',()=>{clearTimeout(t);r()},{once:true})});
 cx.drawImage(v,0,0,cw,ch);await new Promise(r=>requestAnimationFrame(r));rec.start(1000);await v.play();
 let raf,vf,stop=false;const useV=!!v.requestVideoFrameCallback;
 const draw=()=>{if(stop)return;cx.drawImage(v,0,0,cw,ch);say&&say('بيتضغط… '+Math.round(v.currentTime/dur*100)+'%');if(useV)vf=v.requestVideoFrameCallback(draw);else raf=requestAnimationFrame(draw)};draw();
 await waitEv(v,'ended');stop=true;if(raf)cancelAnimationFrame(raf);cx.drawImage(v,0,0,cw,ch);await new Promise(r=>setTimeout(r,120));rec.stop();await stopped;URL.revokeObjectURL(url);
 const type=mime.split(';')[0],out=new Blob(chunks,{type});
 if(okType&&out.size>=file.size&&file.size<=25*1048576)return{...orig,note:'الأصلي أخف من المضغوط فاترفع الأصلي'};
 if(out.size>25*1048576)throw new Error('الفيديو لسه تقيل بعد الضغط ('+Math.round(out.size/1048576)+' ميجا). قصّره أو قلّل دقته.');
 return{blob:out,type,ext:type.includes('webm')?'webm':'mp4',poster,note:'اتضغط من '+(file.size/1048576).toFixed(1)+' إلى '+(out.size/1048576).toFixed(1)+' ميجا'}}
async function heroUpload(inp){
 const f=inp.files&&inp.files[0],say=t=>{const e=$('#hm_st');if(e)e.textContent=t};if(!f)return;
 if(!cloudOn())return say('اربط الموقع بالسحابة من الإعدادات الأول.');
 try{const s=siteCfg(),ts=Date.now(),old=[s.heroImg,s.heroVideo&&s.heroVideo.url,s.heroVideo&&s.heroVideo.poster];
  if(f.type.startsWith('video/')){say('بيجهّز الفيديو…');const r=await prepVideo(f,say);say('بيرفع '+(r.blob.size/1048576).toFixed(1)+' ميجا…');
   const url=await upMedia(r.blob,'hero-'+ts+'.'+r.ext,r.type),poster=await upMedia(r.poster,'hero-'+ts+'-poster.jpg','image/jpeg');
   s.heroVideo={url,poster,type:r.type};s.heroImg='';say('✅ تم. '+(r.note||''))}
  else if(f.type.startsWith('image/')){say('بيجهّز الصورة…');const r=await prepImage(f);say('بيرفع…');
   s.heroImg=await upMedia(r.blob,'hero-'+ts+'.'+r.ext,r.type);s.heroVideo=null;say('✅ تم رفع الصورة ('+(r.blob.size/1024).toFixed(0)+' ك.ب)')}
  else throw new Error('اختار صورة أو فيديو');
  saveLocal('settings');old.filter(u=>u&&String(u).includes('/site-media/')).forEach(delMedia);sPost();setTimeout(siteRe,400)
 }catch(e){say('❌ '+e.message)}finally{inp.value=''}}
function heroClear(){const s=siteCfg();[s.heroImg,s.heroVideo&&s.heroVideo.url,s.heroVideo&&s.heroVideo.poster].forEach(u=>u&&String(u).includes('/site-media/')&&delMedia(u));s.heroImg='';s.heroVideo=null;saveLocal('settings');sPost();siteRe()}

const MK={sel:new Set(),sess:null};
const FB_INBOX='https://business.facebook.com/latest/inbox/all';
function mkCfg(){const m=DB.settings.mkt||(DB.settings.mkt={});
 const d={text:'{أهلاً|مرحباً|يا أهلاً} {الاسم_الاول} 🌸\nعندنا في {المحل} عرض جديد على منتجاتنا {يومين بس|لفترة محدودة}. اطلب من هنا: {الرابط}',ch:'wa',dmin:45,dmax:110,cap:40,cool:7,optline:true,flt:{buy:'bought',last:'',src:'',min:0},log:{},api:{tpl:'',lang:'ar',vars:['first']}};
 for(const k in d)if(m[k]===undefined)m[k]=JSON.parse(JSON.stringify(d[k]));m.flt={...d.flt,...m.flt};m.api={...d.api,...m.api};
 m.dmin=Math.max(30,+m.dmin||45);m.dmax=Math.max(m.dmin,+m.dmax||110);m.cap=Math.min(100,Math.max(1,+m.cap||40));return m}
const mkToday=()=>new Date().toISOString().slice(0,10);
function mkPhone(ph){let p=String(ph||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=DB.settings.cc+p.slice(1);return p.length>=10&&p.length<=15?p:''}
function mkAudience(){const m=mkCfg(),f=m.flt,now=Date.now(),day=864e5;
 return DB.customers.map(c=>({c,s:cStats(c.id),ph:mkPhone(c.phone)})).filter(({c,s,ph})=>{
  if(!ph||c.mktOpt||c.mktBad)return false;if(f.buy=='bought'&&!s.n)return false;if(f.src&&c.source!==f.src)return false;if(+f.min>0&&s.total<+f.min)return false;
  if(f.last){const d=s.last?(now-new Date(s.last))/day:1e9;if(f.last=='30'&&d>30)return false;if(f.last=='idle30'&&d<=30)return false;if(f.last=='idle60'&&d<=60)return false}
  if(m.cool>0&&c.mktLast&&(now-new Date(c.mktLast))/day<m.cool)return false;return true})}
const SPIN=/\{([^{}|]+(?:\|[^{}|]+)+)\}/g;
const mkSpin=t=>t.replace(SPIN,(_,g)=>{const a=g.split('|');return a[Math.floor(Math.random()*a.length)]});
function mkMsg(c,m){let t=mkSpin(m.text||'');const first=String(c.name||'').trim().split(/\s+/)[0]||'';
 t=t.replace(/\{الاسم_الاول\}/g,first).replace(/\{الاسم\}/g,c.name||'').replace(/\{المحل\}/g,DB.settings.shopName||'').replace(/\{الرابط\}/g,String((DB.settings.site&&DB.settings.site.siteUrl)||SITE_DEF.siteUrl).split('?')[0]+'?utm_source='+(m.ch=='wa'?'whatsapp':'facebook')+'&utm_medium=social&utm_campaign=broadcast');
 if(m.optline)t+='\n\n(لو مش عايز توصلك عروض، رد بـ 0)';return t.trim()}
function mkRisk(m,aud){const w=[];let r=0;const combos=(String(m.text).match(SPIN)||[]).reduce((a,g)=>a*(g.split('|').length),1),links=(String(m.text).match(/https?:\/\/\S+/g)||[]).length+(/\{الرابط\}/.test(m.text)?1:0);
 if(m.cap>60){r+=2;w.push('الحد اليومي كبير ('+m.cap+'). الأأمن 20–40 رسالة في اليوم، وابدأ بـ 20 لو الرقم جديد.')}else if(m.cap>40){r+=1;w.push('الحد اليومي فوق 40، خليك حذر.')}
 if(m.dmin<40){r+=1;w.push('الفاصل بين الرسايل قصير؛ الأفضل 45 ثانية أو أكتر.')}
 if(!m.optline){r+=2;w.push('مفيش سطر إلغاء الاشتراك — ده بيزوّد بلاغات السبام.')}
 if(combos<3){r+=2;w.push('الرسالة شبه ثابتة. استخدم صيغ بديلة زي {أهلاً|مرحباً} عشان الرسايل ما تتشابهش (دلوقتي '+combos+' صيغة).')}
 if(links>1){r+=1;w.push('أكتر من لينك في الرسالة بيقلّل الأمان.')}
 if(m.flt.buy!='bought'){r+=2;w.push('الجمهور فيه ناس ما اشتروش منك قبل كده؛ الرسايل لغير العملاء أكتر سبب للحظر.')}
 if(String(m.text).length>600){r+=1;w.push('الرسالة طويلة.')}
 if(!aud.length)w.push('مفيش عملاء مطابقين للفلتر.');
 return{level:r>=4?['خطر 🔴','#c0392b']:r>=2?['متوسط 🟠','#d68910']:['آمن 🟢','#1e8449'],w,combos}}
function mkRefresh(reset){const m=mkCfg(),aud=mkAudience();
 MK.sel=reset?new Set(aud.map(x=>x.c.id)):new Set([...MK.sel].filter(id=>aud.some(x=>x.c.id==id)));
 const today=m.log[mkToday()]||0,rk=mkRisk(m,aud),s1=aud.find(x=>MK.sel.has(x.c.id))||aud[0];

/* ===== الإرسال التلقائي عبر WhatsApp Business API (رسمي) — عن طريق Edge Function اسمها wa-send ===== */
const WA_FATAL=new Set([190,4,17,613,368,80007,130429,131048,131056,132001,132005,132007,132012,132015,132016,131031,131042]);
const WA_VARS={first:'الاسم الأول',full:'الاسم الكامل',shop:'اسم المحل',link:'رابط الموقع'};
async function waCall(b){const c=cfg(),t=await cTok();
 const r=await fetch(c.url.replace(/\/$/,'')+'/functions/v1/wa-send',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.key,Authorization:'Bearer '+t},body:JSON.stringify(b)});
 let d={};try{d=await r.json()}catch(e){}
 if(r.status===404)throw Object.assign(new Error('الدالة wa-send مش متنصّبة في Supabase (اتبع خطوات ملف WHATSAPP-AUTO-SETUP.md)'),{fatal:true});
 if(d.ok===false||(!r.ok&&d.ok!==true))throw Object.assign(new Error(d.message||('خطأ '+r.status)),{code:d.code,fatal:r.status==401||r.status==500});
 return d}
function mkVar(c,k,m){const first=String(c.name||'').trim().split(/\s+/)[0]||'عميلنا';
 return k=='full'?(c.name||first):k=='shop'?(DB.settings.shopName||''):k=='link'?String((DB.settings.site&&DB.settings.site.siteUrl)||SITE_DEF.siteUrl).split('?')[0]+'?utm_source=whatsapp&utm_medium=social&utm_campaign=broadcast':first}

function waTplInfo(m){const t=(MK.tpls||[]).find(x=>x.name===m.api.tpl&&x.language===m.api.lang)||(MK.tpls||[]).find(x=>x.name===m.api.tpl);if(!t)return null;
 const body=((t.components||[]).find(x=>x.type==='BODY')||{}).text||'';return{t,body,n:Math.max(0,...[...body.matchAll(/\{\{(\d+)\}\}/g)].map(x=>+x[1]))}}
function waTplPick(){const m=mkCfg(),i=waTplInfo(m);if(i){m.api.lang=i.t.language;const d=['first','link','shop','full'];m.api.vars=Array.from({length:i.n},(_,k)=>(m.api.vars||[])[k]||d[k]||'first')}else m.api.vars=[];waBox()}

 ${ok?'':'<p style="color:#b00">اربط الموقع بالسحابة من الإعدادات الأول.</p>'}
 <details><summary><b>📋 خطوات الإعداد (مرة واحدة)</b></summary><ol class="mut" style="line-height:1.9"><li>جهّز حساب WhatsApp Business Platform في Meta Business وسجّل رقم عليه (الرقم ده بيشتغل على الـAPI).</li><li>اعمل قالب رسالة من نوع «Marketing» فيه متغير {{1}} للاسم، وانتظر موافقة ميتا.</li><li>اعمل System User وطلّع <b>توكن دائم</b> بصلاحيات whatsapp_business_messaging و whatsapp_business_management.</li><li>في Supabase: Edge Functions ← New function باسم <b>wa-send</b> والصق كود ملف <b>wa-send-edge-function.ts</b>، وفي Secrets ضيف: <span dir="ltr">WA_TOKEN, WA_PHONE_ID, WA_WABA_ID</span>.</li><li>هنا: اضغط «فحص الاتصال» ثم «تحميل القوالب» واختار القالب.</li></ol></details>
 <div class="row"><button class="btn o" onclick="waStatus()">🔌 فحص الاتصال وجودة الرقم</button><button class="btn o" onclick="waTpls()">📥 تحميل القوالب المعتمدة</button></div><div id="waSt" class="mut" style="margin:6px 0"></div>
 <div class="row"><div style="flex:2;min-width:200px"><label>القالب المعتمد</label><select data-m="api.tpl"><option value="">— اختار —</option>${(MK.tpls||[]).map(t=>`<option value="${esc(t.name)}" ${t.name===m.api.tpl?'selected':''}>${esc(t.name)} (${esc(t.language)})</option>`).join('')}${m.api.tpl&&!(MK.tpls||[]).some(t=>t.name===m.api.tpl)?`<option value="${esc(m.api.tpl)}" selected>${esc(m.api.tpl)}</option>`:''}</select></div></div>
 ${i?`<div style="white-space:pre-wrap;background:#0000000a;border-radius:10px;padding:10px;margin:6px 0">${esc(i.body)}</div>${i.n?`<div class="row">${(m.api.vars||[]).map((k,j)=>`<div style="flex:1;min-width:130px"><label>المتغير {{${j+1}}}</label><select data-m="api.vars.${j}">${Object.entries(WA_VARS).map(([v,l])=>`<option value="${v}" ${v===k?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>`:''}`:''}
 <div class="row" style="margin-top:8px"><input id="wa_test" placeholder="رقمك للتجربة 01xxxxxxxxx" style="flex:1;min-width:160px"><button class="btn o" onclick="waTest()">📨 ابعت رسالة تجربة</button></div>

async function waStatus(){const s=$('#waSt');s.textContent='بيفحص…';try{const d=await waCall({action:'status'});
 const q=d.quality_rating,col=q=='GREEN'?'#1e8449':q=='YELLOW'?'#d68910':'#c0392b';

async function waTpls(){const s=$('#waSt');s.textContent='بيحمّل القوالب…';try{const d=await waCall({action:'templates'});MK.tpls=d.data||[];const m=mkCfg();
 if(!MK.tpls.length)s.textContent='مفيش قوالب معتمدة لسه.';else{if(!m.api.tpl){m.api.tpl=MK.tpls[0].name;saveLocal('settings')}waTplPick();$('#waSt').textContent='✅ اتحمّل '+MK.tpls.length+' قالب معتمد'}}catch(e){s.innerHTML='<span style="color:#b00">❌ '+esc(e.message)+'</span>'}}
async function waTest(){const m=mkCfg(),ph=mkPhone(val('wa_test')),s=$('#waSt');if(!ph)return toast('اكتب رقم صالح');if(!m.api.tpl)return toast('اختار القالب الأول');
 s.textContent='بيبعت…';try{await waCall({action:'send',to:ph,template:m.api.tpl,lang:m.api.lang,params:waParams({name:'تجربة'},m)});s.textContent='✅ اتبعتت رسالة التجربة'}catch(e){s.innerHTML='<span style="color:#b00">❌ '+esc(e.message)+'</span>'}}
function autoStart(){const m=mkCfg(),q=mkAudience().filter(x=>MK.sel.has(x.c.id)).map(x=>x.c.id);
 if(!cloudOn())return toast('اربط الموقع بالسحابة الأول');if(!m.api.tpl)return toast('اختار قالب معتمد الأول');if(!q.length)return toast('اختار عملاء الأول');
 const left=m.cap-(m.log[mkToday()]||0);if(left<=0)return toast('وصلت للحد اليومي ('+m.cap+')، كمّل بكرة');
 const n=Math.min(q.length,left);
 if(!confirm('هيبعت '+n+' رسالة واتساب تلقائي (ميتا بتحاسب على كل رسالة تسويقية) بفاصل '+m.dmin+'–'+m.dmax+' ثانية، ومحتاج الصفحة تفضل مفتوحة (حوالي '+Math.ceil(n*(m.dmin+m.dmax)/2/60)+' دقيقة). نبدأ؟'))return;
 MK.auto={q:q.slice(0,n),i:0,sent:0,fail:0,consec:0,paused:false,run:true,next:0,log:[]};
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>MK.auto.wl=w).catch(()=>{})}catch(e){}
 window.onbeforeunload=e=>{if(MK.auto&&MK.auto.run){e.preventDefault();return e.returnValue='الإرسال شغال'}};
 modal('<div id="autoBox"></div>');autoDraw();autoStep()}
function autoDraw(){const A=MK.auto,b=$('#autoBox');if(!A||!b)return;const pc=Math.round(A.i/A.q.length*100);
 b.innerHTML=`<h3>⚡ إرسال تلقائي ${A.run?(A.paused?'(متوقف مؤقتًا)':'(شغال)'):'(خلص)'}</h3><div style="background:#0001;border-radius:8px"><div style="width:${pc}%;background:#2e9e57;height:10px;border-radius:8px"></div></div><p>${A.i} / ${A.q.length} — ✅ ${A.sent} نجح — ❌ ${A.fail} فشل</p><div id="autoWait" class="mut"></div>${A.run?`<div class="row"><button class="btn o" onclick="MK.auto.paused=!MK.auto.paused;autoDraw()">${A.paused?'▶ كمّل':'⏸ إيقاف مؤقت'}</button><button class="btn r" onclick="autoStop('أوقفته بنفسك')">⏹ إيقاف</button></div>`:`<p><b>${esc(A.why||'')}</b></p><button class="btn" onclick="closeModal()">تمام</button>`}<div style="max-height:220px;overflow:auto;font-size:13px;margin-top:8px">${A.log.slice(-40).reverse().map(x=>`<div>${esc(x)}</div>`).join('')}</div>`}
function autoStop(why){const A=MK.auto;if(!A)return;A.run=false;A.why=why;clearTimeout(A.timer);try{A.wl&&A.wl.release()}catch(e){}window.onbeforeunload=null;autoDraw()}
async function autoStep(){const A=MK.auto;if(!A||!A.run)return;
 if(!$('#autoBox'))return autoStop('اتقفلت النافذة');
 if(A.paused){A.timer=setTimeout(autoStep,1000);return}
 const m=mkCfg(),k=mkToday();
 if(A.i>=A.q.length)return autoStop('خلصت القايمة ✅');
 if((m.log[k]||0)>=m.cap)return autoStop('وصلت للحد اليومي 🛑');
 const c=cust(A.q[A.i]);if(!c||c.mktOpt||!mkPhone(c.phone)){A.i++;return autoStep()}
 try{await waCall({action:'send',to:mkPhone(c.phone),template:m.api.tpl,lang:m.api.lang,params:waParams(c,m)});
  c.mktLast=new Date().toISOString();c.mktCh='wa-api';m.log[k]=(m.log[k]||0)+1;Object.keys(m.log).sort().slice(0,-40).forEach(x=>delete m.log[x]);A.sent++;A.consec=0;A.log.push('✓ '+c.name);save('customers','settings')}
 catch(e){A.fail++;A.consec++;A.log.push('✗ '+c.name+': '+e.message);
  if(e.fatal||WA_FATAL.has(+e.code)){A.i++;return autoStop('وقفت تلقائي لحماية الرقم: '+e.message)}
  if(A.consec>=3){A.i++;return autoStop('وقفت بعد 3 فشل ورا بعض: '+e.message)}}
 A.i++;autoDraw();if(A.i>=A.q.length)return autoStop('خلصت القايمة ✅');
 A.next=Date.now()+(MK.fast?200:(m.dmin+Math.random()*(m.dmax-m.dmin))*1000);
 const tk=()=>{if(!MK.auto||!A.run)return;if(!$('#autoBox'))return autoStop('اتقفلت النافذة');
  if(A.paused){A.timer=setTimeout(tk,1000);return}
  const l=Math.ceil((A.next-Date.now())/1000),w=$('#autoWait');if(l>0){if(w)w.textContent='⏳ الرسالة الجاية بعد '+l+' ثانية';A.timer=setTimeout(tk,Math.min(1000,A.next-Date.now()));}else{if(w)w.textContent='';autoStep()}};tk()}

function mkExport(){const m=mkCfg(),aud=mkAudience().filter(x=>MK.sel.has(x.c.id));
