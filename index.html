<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diva | اطلب أونلاين</title>
<meta name="description" content="Signature Scent - عطور بتوقيعك الخاص">
<meta name="theme-color" content="#a67420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5ecd9; --paper:#faf6ee; --rose:#a67420; --rose-d:#815a19; --tan:#d9ae4f; --tan-d:#be8f29;
  --ink:#2e2218; --mut:#7a6650; --lilac:#dcd7d3; --plum:#5e4936; --ok:#3d7a4a;
  --hand:'El Messiri','Tajawal',serif; --body:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.6;
  background:var(--cream) radial-gradient(#e8d9b0 1px,transparent 1.3px) 0 0/22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--rose-d)}
.gingham{height:16px;background:
  repeating-linear-gradient(0deg,rgba(166,116,32,.32) 0 8px,transparent 8px 16px),
  repeating-linear-gradient(90deg,rgba(166,116,32,.32) 0 8px,transparent 8px 16px),#fffaf0}
.scallop{height:14px;background:radial-gradient(circle at 12px 0,var(--paper) 11px,transparent 12px) 0 0/24px 14px repeat-x}

/* ---------- الهيدر ---------- */
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--tan);box-shadow:0 3px 10px #7a4a2a1a}
.hd{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--rose-d);flex:1;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--tan)}
.brand b{font-family:var(--hand);font-size:27px;line-height:1;white-space:nowrap}
.cartbtn{position:relative;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--rose-d)}
.cartbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rose-d)}
.cartbtn .cnt{background:#fff;color:var(--rose-d);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 5px}

/* ---------- الهيرو ---------- */
.hero{position:relative;text-align:center;padding:34px 16px 10px;max-width:900px;margin:auto}
.frame{display:inline-block;padding:10px;background:#fff;border:2px solid var(--tan);border-radius:30px;transform:rotate(-2.5deg);box-shadow:0 8px 20px #7a4a2a26,0 0 0 6px var(--paper),0 0 0 8px var(--tan)}
.frame img{display:block;width:min(210px,52vw);aspect-ratio:1;object-fit:cover;border-radius:22px}
.hero h1{font-family:var(--hand);color:var(--rose);font-size:clamp(38px,8vw,64px);margin:26px 0 4px;line-height:1.2;text-shadow:2px 2px 0 var(--paper),3px 3px 0 var(--tan)}
.hero p{margin:6px auto;max-width:560px;color:var(--mut);font-size:18px}
.cta{display:inline-block;margin-top:14px;background:var(--rose);color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:12px 30px;border-radius:999px;box-shadow:0 4px 0 var(--rose-d);border:2px dashed #ffffff90;outline:3px solid var(--rose)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rose-d)}
.sprig{position:absolute;top:60px;width:70px;opacity:.9}
.sprig.l{left:6px}.sprig.r{right:6px;transform:scaleX(-1)}
@media(max-width:560px){.sprig{width:46px;top:40px}}

.steps{max-width:900px;margin:26px auto 6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 14px}
.step{background:var(--paper);border:2px dashed var(--tan-d);border-radius:16px;padding:10px 8px;text-align:center;font-size:14.5px}
.step i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--rose);color:#fff;font-style:normal;font-weight:800}

/* ---------- المنتجات ---------- */
.shop{max-width:1180px;margin:0 auto;padding:22px 14px 120px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tools input{flex:1;min-width:200px;padding:11px 16px;border-radius:999px;border:2px solid var(--tan);background:var(--paper);outline:0}
.tools input:focus{border-color:var(--rose)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}
.chips button{flex:none;border:2px solid var(--tan);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:500}
.chips button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.sec h2{font-family:var(--hand);color:var(--rose-d);font-size:32px;margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.sec h2::after{content:"";flex:1;height:10px;background:repeating-linear-gradient(90deg,var(--tan) 0 8px,transparent 8px 14px);border-radius:6px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.pc{position:relative;background:var(--paper);border:2px solid var(--tan);border-radius:20px;padding:12px;display:flex;flex-direction:column;box-shadow:0 5px 0 #d9ae4f66,0 8px 14px #7a4a2a14;transition:transform .15s}
.pc:hover{transform:translateY(-3px) rotate(-.4deg)}
.pc::after{content:"";position:absolute;inset:5px;border:1.5px dashed #be8f2980;border-radius:15px;pointer-events:none}
.ph{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#efe3c4,#f8f0dc);border:2px solid #fff;box-shadow:inset 0 0 0 1px var(--tan)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .ph0{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;color:#be8f29aa;font-size:12px}
.ph .ph0 svg{width:46%;height:auto}
.pc .nm{font-weight:800;font-size:16.5px;margin:10px 4px 0;line-height:1.35;min-height:2.7em}
.pc .sz{margin:0 4px;color:var(--mut);font-size:14px}
.pc .bt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 4px 2px}
.price{font-family:var(--hand);font-size:25px;color:var(--rose-d);font-weight:700;white-space:nowrap}
.price small{font-family:var(--body);font-size:13px;color:var(--mut);font-weight:500}
.price s.old{font-family:var(--body);font-size:14px;color:var(--mut);font-weight:500;margin-inline-end:4px}
.dbadge{position:absolute;top:8px;right:8px;z-index:2;background:var(--plum);color:#fff;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;box-shadow:0 2px 0 #463729;transform:rotate(-3deg)}
.add{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 var(--rose-d);position:relative;z-index:1}
.add:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rose-d)}
.add[disabled]{background:#c9b9a8;box-shadow:0 3px 0 #a99884;cursor:not-allowed}
.stp{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.stp button{width:32px;height:32px;border-radius:50%;border:2px solid var(--rose);background:#fff;color:var(--rose-d);font-size:20px;line-height:1;cursor:pointer;font-weight:800;padding:0}
.stp b{min-width:22px;text-align:center}
.soldout{position:absolute;top:18px;right:-4px;background:var(--plum);color:#fff;padding:2px 14px;border-radius:6px;font-size:13px;font-weight:700;z-index:2;transform:rotate(3deg)}
.empty{text-align:center;color:var(--mut);padding:40px 0}

/* ---------- شريط السلة السفلي ---------- */
.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;max-width:560px;margin:auto;background:var(--rose);color:#fff;border-radius:18px;padding:12px 18px;display:none;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 6px 0 var(--rose-d),0 10px 24px #815a1955;font-weight:800}
.bar.show{display:flex}

/* ---------- درج السلة ---------- */
.ov{position:fixed;inset:0;background:#3a1d1f88;z-index:40;opacity:0;pointer-events:none;transition:.25s}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(450px,100%);background:var(--paper);z-index:41;transform:translateX(-105%);transition:transform .3s;display:flex;flex-direction:column;border-right:3px solid var(--tan)}
.drawer.show{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px dashed var(--tan)}
.dh h3{margin:0;font-family:var(--hand);font-size:28px;color:var(--rose-d)}
.x{background:none;border:0;font-size:28px;cursor:pointer;color:var(--mut);line-height:1}
.db{flex:1;overflow:auto;padding:12px 16px}
.df{padding:12px 16px;border-top:2px dashed var(--tan);background:#fff8e6}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted var(--tan-d)}
.li .th{width:54px;height:54px;border-radius:10px;background:#efe3c4;overflow:hidden;flex:none;border:1px solid var(--tan)}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0;font-size:15px}.li .tx small{color:var(--mut);display:block}
.li .sm{font-weight:800;min-width:56px;text-align:left}
.tot>div{display:flex;justify-content:space-between;padding:2px 0}
.tot .g{font-size:21px;font-weight:800;color:var(--rose-d);border-top:2px solid var(--tan);margin-top:6px;padding-top:6px}
.btn{width:100%;border:0;background:var(--rose);color:#fff;font-weight:800;font-size:18px;padding:13px;border-radius:14px;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 var(--rose-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rose-d)}
.btn[disabled]{background:#c9b9a8;box-shadow:0 4px 0 #a99884;cursor:wait}
.btn.wa{background:#2e9e57;box-shadow:0 4px 0 #1f7a41;text-decoration:none;display:block;text-align:center}
.btn.sec2{background:#fff;color:var(--rose-d);border:2px solid var(--rose);box-shadow:none}
label.f{display:block;margin:10px 0 3px;font-size:14px;color:var(--mut);font-weight:500}
.in{width:100%;padding:10px 12px;border:2px solid var(--tan);border-radius:12px;background:#fff;outline:0}
.in:focus{border-color:var(--rose)}
.pm{display:flex;gap:10px;align-items:center;border:2px solid var(--tan);border-radius:14px;padding:10px 12px;margin:6px 0;cursor:pointer;background:#fff}
.pm.on{border-color:var(--rose);background:#fff1ef}
.pm input{accent-color:var(--rose);width:18px;height:18px}
.note{background:#fff3cf;border:1.5px dashed var(--tan-d);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.note b.cp{background:#fff;border:1px solid var(--tan);border-radius:8px;padding:1px 8px;direction:ltr;display:inline-block;cursor:pointer}
.err{background:#ffe3e1;border:1.5px solid var(--rose);color:var(--rose-d);padding:9px 12px;border-radius:12px;margin-top:10px;font-weight:700}
.done{text-align:center;padding:10px 4px}
.done .big{font-size:60px}
.done h4{font-family:var(--hand);font-size:30px;margin:4px 0;color:var(--rose-d)}
.done .no{display:inline-block;background:#fff;border:2px dashed var(--rose);border-radius:12px;padding:4px 16px;font-size:22px;font-weight:800;margin:6px 0}
.hp{position:absolute;left:-9999px;opacity:0}

/* ---------- الفوتر ---------- */
footer{background:var(--paper);border-top:2px solid var(--tan);text-align:center;padding:0 14px 90px}
footer .in2{max-width:700px;margin:auto;padding:22px 0 8px}
footer .fn{font-family:var(--hand);font-size:30px;color:var(--rose-d)}
footer p{margin:4px 0;color:var(--mut)}
footer .cr{font-size:13px;margin-top:12px;opacity:.85}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.skel{height:300px;border-radius:20px;background:linear-gradient(90deg,#f0e5c8 25%,#f9f2de 50%,#f0e5c8 75%) 0 0/200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- لوحة التحكم: العداد والشحن ---------- */
#cdBar{display:none;text-align:center;padding:8px 10px}
#cdBar .ct{display:block;font-weight:800;font-size:18px;margin-bottom:4px;font-family:var(--hand)}
#cdBar .cu{display:flex;justify-content:center;gap:10px}
#cdBar .cu span{background:#ffffff26;border-radius:12px;padding:4px 10px;min-width:64px;font-size:12px;display:flex;flex-direction:column;align-items:center}
#cdBar .cu i{font-style:normal;font-size:24px;font-weight:800;line-height:1.1}
#top{display:flex;flex-direction:column}#top>*{width:100%}
.pm b.sf{margin-inline-start:auto}
/* ---------- سوشيال وواتساب عائم ---------- */
.soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.soc a{background:#fff;border:2px solid var(--tan);border-radius:999px;padding:5px 16px;text-decoration:none;font-weight:700;color:var(--rose-d)}
#waFab{display:none;position:fixed;left:14px;bottom:88px;z-index:24;width:54px;height:54px;border-radius:50%;background:#2e9e57;color:#fff;font-size:28px;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px #0004}
/* ---------- نافذة المنتج والاختيارات ---------- */
#pm{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:flex-end;justify-content:center}
#pm.show{display:flex}
.pms{background:var(--paper);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;position:relative}
.pms .px{position:absolute;top:10px;left:10px;border:0;background:#0001;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.pmi{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.pmd{line-height:1.8;color:var(--mut)}
.og{margin:12px 0}.og i{color:var(--rose);font-style:normal}
.oc{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{border:2px solid var(--tan);background:#fff;border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}
.opt.on{background:var(--rose);border-color:var(--rose);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- منع الإزاحة الأفقية على الموبايل والكمبيوتر ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%;overflow-x:clip}
body{max-width:100%;overflow-x:clip;overflow-wrap:break-word}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
img,svg,video,canvas{max-width:100%}
.hd>*,.hero,.steps>*,.pc,.li .tx{min-width:0}
.grid>*,.sec{min-width:0}
.pc .nm,.pc .sz,.li .tx b{overflow-wrap:anywhere}
input,select,textarea,.in,.tools input{font-size:16px!important;max-width:100%}
#cdBar .cu span{min-width:0;flex:1;max-width:84px;padding:4px 6px}

/* كارت المنتج: السعر والزرار ما يخرجوش بره الكارت */
.bt{flex-wrap:wrap;row-gap:8px}
.bt>div{min-width:0}
.price{white-space:normal}
.add{white-space:normal;max-width:100%}
@media(max-width:520px){.pc .bt{flex-direction:column;align-items:stretch;text-align:center}.pc .bt .add,.pc .bt .stp{width:100%;justify-content:center}.price{font-size:21px}}
/* ---------- صورة/فيديو الهيرو ---------- */
.frame video{display:block;width:min(210px,52vw);aspect-ratio:1;object-fit:cover;border-radius:22px;background:#f3e9cf}
.frame:not(.rdy){visibility:hidden}
.frame.hasv{transform:none}
.frame video{backface-visibility:hidden;transform:translateZ(0)}
.frame.wide{display:block;max-width:min(780px,94vw);margin:0 auto;padding:6px;transform:none}
.frame.wide img,.frame.wide video{width:100%;aspect-ratio:auto;max-height:68vh;object-fit:cover;border-radius:24px}

/* ===== Diva luxe ===== */
:root{--g1:#f6e08e;--g2:#d9a93a;--g3:#a8751f;--gold:linear-gradient(135deg,#f6e08e 0%,#d9a93a 38%,#a8751f 62%,#f1d57a 100%);--br:#5e4936;--brd:#3f3123}
body{background:var(--cream)}
header{background:linear-gradient(180deg,#4a3a2a,#3f3123);border-bottom:2px solid transparent;border-image:var(--gold) 1;box-shadow:0 4px 16px #0004}
.brand{color:var(--g1)}.brand b{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.brand img{border:2px solid var(--g2)}
.cartbtn{background:var(--gold);color:#2e2218;box-shadow:0 3px 0 #7a5513}.cartbtn .cnt{background:#3f3123;color:var(--g1)}
.gingham,.scallop{display:none}
.hero{max-width:none;margin:0;padding:54px 16px 46px;background:radial-gradient(ellipse at 50% 35%,#6b5640 0%,#4a3a2a 55%,#33271c 100%);position:relative;overflow:hidden;border-bottom:3px solid transparent;border-image:var(--gold) 1}
.hero::before{content:"";position:absolute;inset:0;opacity:.16;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><g fill='none' stroke='%23201509' stroke-width='3'><path d='M0 90 L70 120 L110 80 L190 140 L260 100 L400 170'/><path d='M120 400 L150 310 L230 280 L260 200 L340 160'/><path d='M0 300 L90 260 L170 300 L230 280'/><path d='M310 0 L290 70 L350 130 L400 120'/></g></svg>") center/520px}
.hero>*{position:relative}.sprig{display:none}
.frame{background:transparent;padding:0;border:0;border-radius:18px;transform:none;box-shadow:0 0 0 2px var(--g2),0 0 0 7px #3f3123,0 0 0 9px var(--g1),0 18px 40px #0008}
.frame img{border-radius:16px;width:min(250px,60vw)}
.hero h1{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;letter-spacing:6px;filter:drop-shadow(0 2px 6px #0007)}
.hero p{color:#e9d7ae}
.cta{background:var(--gold);color:#2e2218;border:0;outline:2px solid var(--g1);outline-offset:3px;box-shadow:0 6px 20px #d9a93a55;text-transform:uppercase;letter-spacing:.5px}
.steps .step{background:#fffaf0;border:1px solid var(--g2);border-style:solid}
.step i{background:var(--gold);color:#2e2218}
.sec h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #0001)}
.sec h2::after{height:2px;background:var(--gold);opacity:1;border-radius:0}
.pc{background:#fffaf0;border:1px solid var(--g2);border-radius:10px;box-shadow:0 0 0 4px #faf6ee,0 0 0 5px var(--g2),0 14px 24px #5e493622}
.ph{background:linear-gradient(135deg,#4a3a2a,#6b5640);border:1px solid var(--g2);border-radius:6px}
.price{color:var(--g3)}
.add,.btn,.chips button.on{background:var(--gold);color:#2e2218;border:0;box-shadow:0 3px 0 #7a5513}
.chips button{border:1px solid var(--g2);color:var(--br)}
.dbadge{background:var(--brd);color:var(--g1)}
</style>
</head>
<body>

<div id="cdBar"></div>

async function api(path,opt){

  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}

function applySite(){
  const st=SITE(),t=st.theme||{},tx=st.text||{},sh=st.show||{},R=document.documentElement.style;
  const map={rose:'--rose',roseD:'--rose-d',tan:'--tan',tanD:'--tan-d',ink:'--ink',mut:'--mut',plum:'--plum',cream:'--cream',paper:'--paper'};
  for(const k in map){if(t[k])R.setProperty(map[k],t[k]);else R.removeProperty(map[k])}
  const fam=[...new Set([t.hand,t.body].filter(x=>x&&GF.includes(x)))];
  if(fam.length){
    const href='https://fonts.googleapis.com/css2?'+fam.map(f=>'family='+f.replace(/ /g,'+')+(GF2.includes(f)?':wght@400;700':'')).join('&')+'&display=swap';
    let fl=document.getElementById('siteFont');
    if(!fl){fl=document.createElement('link');fl.id='siteFont';fl.rel='stylesheet';document.head.appendChild(fl)}
    if(fl.getAttribute('href')!==href)fl.setAttribute('href',href)}
  if(t.hand)R.setProperty('--hand',`'${t.hand}','Tajawal',serif`);else R.removeProperty('--hand');
  if(t.body)R.setProperty('--body',`'${t.body}','Segoe UI',Tahoma,Arial,sans-serif`);else R.removeProperty('--body');
  const css=[];
  if(+t.base)css.push(`body{font-size:${+t.base}px}`);
  if(+t.h1)css.push(`.hero h1{font-size:clamp(34px,8vw,${+t.h1}px)}`);
  if(+t.radius)css.push(`.pc,.in,.pm{border-radius:${+t.radius}px}`);
  if(+t.maxw)css.push(`.hd,.shop,.steps,.hero{max-width:${+t.maxw}px}`);
  if(+t.gridMin)css.push(`@media(min-width:521px){.grid{grid-template-columns:repeat(auto-fill,minmax(${+t.gridMin}px,1fr))}}`);
  if(sh.sprigs===false)css.push('.sprig{display:none}');
  if(sh.gingham===false)css.push('.gingham{display:none}');
  if(st.css)css.push(st.css);
  let ds=document.getElementById('siteCss');
  if(!ds){ds=document.createElement('style');ds.id='siteCss';document.head.appendChild(ds)}
  ds.textContent=css.join('\n');
  const setT=(id,v)=>{const e=document.getElementById(id);if(!e)return;if(e.dataset.d===undefined)e.dataset.d=e.textContent;e.textContent=v||e.dataset.d};
  setT('heroSub',tx.heroSub);setT('heroCta',tx.cta);setT('st1',tx.step1);setT('st2',tx.step2);setT('st3',tx.step3);

  const hl=$('#heroLogo');if(hl.dataset.d===undefined)hl.dataset.d=hl.src;
  hl.src=st.heroImg||S.shop.logo_url||hl.dataset.d;
  const fr=hl.parentElement,vd=st.heroVideo&&st.heroVideo.url?st.heroVideo:null;let ve=document.getElementById('heroVid');
  fr.classList.toggle('wide',st.heroSize==='wide'&&!!(vd||st.heroImg));
  if(vd&&heroVideoOk()){
    hl.style.display='none';
    if(!ve||ve.dataset.src!==vd.url){if(ve)ve.remove();ve=document.createElement('video');ve.id='heroVid';ve.dataset.src=vd.url;
      ve.muted=ve.defaultMuted=ve.loop=ve.playsInline=ve.autoplay=true;ve.setAttribute('muted','');ve.setAttribute('playsinline','');ve.preload='metadata';ve.disablePictureInPicture=true;
      if(vd.poster)ve.poster=vd.poster;ve.innerHTML=`<source src="${esc(vd.url)}" type="${esc(vd.type||'video/mp4')}">`;fr.appendChild(ve);watchVid(ve)}}
  else{if(ve)ve.remove();if(vd&&vd.poster)hl.src=vd.poster;hl.style.display=''}
  fr.classList.toggle('hasv',!!(vd&&heroVideoOk()));fr.classList.add('rdy');

function heroVideoOk(){const c=navigator.connection||{};return !/(^|-)2g$/.test(c.effectiveType||'')}
function watchVid(v){
  const kick=()=>{['touchstart','pointerdown','scroll','keydown'].forEach(e=>removeEventListener(e,kick,true));if(v.isConnected&&!document.hidden)v.play().catch(()=>{})};
  const play=()=>{if(!v.isConnected)return;const p=v.play();if(p&&p.catch)p.catch(()=>{['touchstart','pointerdown','scroll','keydown'].forEach(e=>addEventListener(e,kick,{capture:true,once:true,passive:true}))})};
  v.addEventListener('ended',()=>{v.currentTime=0;play()});
  if('IntersectionObserver' in window)new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?play():v.pause()),{threshold:.1}).observe(v);else play();
  document.addEventListener('visibilitychange',()=>{if(!v.isConnected)return;document.hidden?v.pause():play()});
  const s=v.querySelector('source');if(s)s.addEventListener('error',()=>{v.remove();const hl=$('#heroLogo');hl.style.display=''});
  v.addEventListener('canplay',play,{once:true})}

let cdT;
function drawCounter(){
  const c=SITE().counter||{},box=$('#cdBar');clearInterval(cdT);
  const end=c.endAt?new Date(c.endAt).getTime():0;
  if(!c.on||!end||isNaN(end)){box.innerHTML='';box.style.display='none';return}
  box.style.cssText=`display:block;background:${c.bg||'#5e4936'};color:${c.fg||'#ffffff'}`;
  const tick=()=>{const d=end-Date.now();
    if(d<=0){clearInterval(cdT);if(c.endText){box.innerHTML=`<div class="cd"><b class="ct" style="margin:0">${esc(c.endText)}</b></div>`}else{box.innerHTML='';box.style.display='none'}return}
    const s=Math.floor(d/1000),u=[['يوم',Math.floor(s/86400)],['ساعة',Math.floor(s%86400/3600)],['دقيقة',Math.floor(s%3600/60)],['ثانية',s%60]];
    box.innerHTML=`<div class="cd">${c.title?`<b class="ct">${esc(c.title)}</b>`:''}<div class="cu">${u.map(([l,v])=>`<span><i>${String(v).padStart(2,'0')}</i>${l}</span>`).join('')}</div></div>`};
  tick();cdT=setInterval(tick,1000)}

/*PROMO_START*/
const counterOn=()=>{const c=SITE().counter||{},e=c.endAt?new Date(c.endAt).getTime():0;return !!c.on&&e>Date.now()};
const promoActive=pr=>pr&&pr.on!==false&&(pr.withCounter===false||counterOn());
const origPrice=p=>+p.old_price>+p.price?+p.old_price:+p.price;
function promoCalc(){
  const its=items();if(!its.length)return null;let best=null;
  for(const pr of (SITE().promos||[]).filter(promoActive)){
    const sel=its.filter(x=>pr.all!==false||(pr.codes||[]).includes(x.p.code));
    if(sel.reduce((a,x)=>a+x.q,0)<(+pr.minQty||1))continue;
    const orig=sel.reduce((a,x)=>a+unitOrig(x.p)*x.q,0),cur=sel.reduce((a,x)=>a+unit(x.p)*x.q,0);
    const after=pr.type=='egp'?Math.max(0,orig-(+pr.value||0)):orig*(1-(+pr.value||0)/100);
    const d=Math.round((cur-after)*100)/100;
    if(!best||d>best.d)best={name:pr.name||'عرض خاص',d,disc:Math.round((orig-after)*100)/100,adj:Math.round((orig-cur)*100)/100,codes:sel.map(x=>x.p.code),pr}}
  return best}
const promoD=()=>(promoCalc()||{d:0}).d;
const netTot=()=>Math.round((sub()-promoD()+delivery())*100)/100;

    if(q>0&&q<m)return `<div class="note">🏷️ ضيف ${m-q} منتج كمان وخد خصم ${pr.type=='egp'?n2(+pr.value)+' ج':(+pr.value)+'%'}${pr.name?' ('+esc(pr.name)+')':''}</div>`}

  if(S.view=='cart'){
    $('#dTitle').textContent='سلة '+(S.shop.shop_name||'Diva');
    body.innerHTML=it.length?it.map(x=>`<div class="li"><div class="th">${x.p.image_url?`<img src="${esc(x.p.image_url)}" alt="" onerror="this.remove()">`:''}</div><div class="tx"><b>${esc(x.p.name)}</b><small>${esc(x.p.size||'')} · ${n2(dU(x.p))} ج</small>${optLineHTML(x.p)}</div><div class="stp"><button onclick="chg('${x.p.code}',-1)">−</button><b>${x.q}</b><button onclick="chg('${x.p.code}',1)">+</button></div><div class="sm">${n2(dU(x.p)*x.q)}</div></div>`).join(''):'<div class="empty">السلة فاضية.. اختار حاجة تعجبك 👑</div>';
    foot.innerHTML=it.length?totHTML()+`<button class="btn" onclick="toForm()">كمّل الطلب ←</button>`:'';return}
  /* form */
  $('#dTitle').textContent='بياناتك';
  const sh=S.shop,f=S.f;
  const PM=payMethods(),pays=PM.map(m=>[m.k,m.label]);
  if(!pays.some(x=>x[0]==S.pay))S.pay=pays[0][0];
  const cur=PM.find(m=>m.k==S.pay)||{},tr=!!cur.transfer,num=cur.number||'';
  body.innerHTML=`<input class="hp" id="f_hp" tabindex="-1" autocomplete="off">
  <label class="f">الاسم</label><input class="in" id="f_name" value="${esc(f.name)}" autocomplete="name">
  <label class="f">رقم الموبايل (واتساب)</label><input class="in" id="f_phone" type="tel" inputmode="tel" value="${esc(f.phone)}" autocomplete="tel">
  <label class="f">العنوان بالتفصيل</label><input class="in" id="f_addr" value="${esc(f.address)}" autocomplete="street-address">
  <label class="f">ملاحظات (اختياري)</label><input class="in" id="f_notes" value="${esc(f.notes)}">
  ${shipHTML()}
  <label class="f">طريقة الدفع</label>
  ${pays.map(([k,l])=>`<label class="pm ${S.pay==k?'on':''}"><input type="radio" name="pay" ${S.pay==k?'checked':''} onchange="setPay('${k}')"> ${l}</label>`).join('')}
  ${tr?`<div class="note">حوّل <b>${n2(netTot())} ج</b> على ${esc(cur.name||'')}:<br><b class="cp" onclick="copyTxt('${esc(num)}')">${esc(num)}</b> <small>(اضغط للنسخ)</small>${cur.note?'<br>'+esc(cur.note):''}<br>وبعدها اكتب رقم العملية أو ارفع صورة التحويل.</div>
  <label class="f">رقم العملية / رقم المحوَّل منه</label><input class="in" id="f_ref" value="${esc(f.ref||'')}">
  <label class="f">صورة التحويل (اختياري لو كتبت الرقم)</label><input class="in" id="f_rec" type="file" accept="image/*">`:''}
  ${S.err?`<div class="err">${esc(S.err)}</div>`:''}`;
  foot.innerHTML=totHTML()+`<button class="btn" id="sendBtn" onclick="submitOrder()" ${S.busy?'disabled':''}>${S.busy?'جاري الإرسال...':'✔ تأكيد الطلب'}</button><button class="btn sec2" onclick="S.view='cart';drawDrawer()">← رجوع للسلة</button>`}
function totHTML(){const pc=promoCalc(),d=delivery(),min=+S.shop.min_order||0;
  return `<div class="tot"><div><span>المنتجات</span><span>${n2(sub()+(pc?pc.adj:0))} ج</span></div>${pc&&pc.disc>0?`<div style="color:var(--plum)"><span>🏷️ ${esc(pc.name)}${pc.adj>0?' (بدل خصم المنتج)':''}</span><span>- ${n2(pc.disc)} ج</span></div>`:''}${d>0?`<div><span>التوصيل</span><span>${n2(d)} ج</span></div>`:''}<div class="g"><span>الإجمالي</span><span>${n2(sub()-promoD()+d)} ج</span></div></div>${promoHint()}${min&&sub()<min?`<div class="note">الحد الأدنى للطلب ${n2(min)} ج</div>`:''}`}
function readForm(){const g=id=>($('#'+id)?.value??'').trim();
  S.f={name:g('f_name'),phone:g('f_phone'),area:g('f_area'),address:g('f_addr'),notes:g('f_notes'),ref:$('#f_ref')?g('f_ref'):S.f.ref};lsSet('diva_cust',{...S.f,ref:''})}
function setPay(k){readForm();S.pay=k;S.err='';drawDrawer()}
function toForm(){
  if(S.shop.accepting===false)return toast('الطلبات متوقفة مؤقتًا');
  const min=+S.shop.min_order||0;if(min&&sub()<min)return toast('الحد الأدنى للطلب '+n2(min)+' ج');
  const om=optMissing();if(om){toast('اختار '+om.g.name+' لـ '+om.p.name);closeCart();return openProd(om.p.code)}
  track('InitiateCheckout',{value:sub()-promoD(),items:cartItemsT()});S.view='form';S.err='';drawDrawer()}
function copyTxt(t){try{navigator.clipboard.writeText(t);toast('تم النسخ ✔')}catch(e){toast(t)}}

function blobOf(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',q)};im.onerror=()=>no(new Error('x'));im.src=r.result};r.onerror=()=>no(new Error('x'));r.readAsDataURL(file)})}
const rid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,12));

async function submitOrder(){
  if(S.busy)return;readForm();
  if($('#f_hp')&&$('#f_hp').value)return; // سبام
  const f=S.f,digits=f.phone.replace(/\D/g,'');
  const fail=m=>{S.err=m;drawDrawer()};
  const om=optMissing();if(om)return fail('اختار '+om.g.name+' لـ '+om.p.name);
  if(f.name.length<2)return fail('اكتب اسمك');
  if(digits.length<10)return fail('رقم الموبايل مش مظبوط');
  if(deliveryAreas().length&&!deliveryAreas().some(a=>String(a.name).trim()===String(f.area||'').trim()))return fail('اختار منطقة التوصيل عشان نحدد السعر');
  if(f.address.length<3)return fail('اكتب عنوانك بالتفصيل');
  const tr=!!(payMethods().find(m=>m.k==S.pay)||{}).transfer,file=$('#f_rec')&&$('#f_rec').files[0];
  if(tr&&!f.ref&&!file)return fail('اكتب رقم العملية أو ارفع صورة التحويل');
  S.busy=true;S.err='';drawDrawer();
  try{
    let receipt='';
    if(tr&&file){try{const b=await blobOf(file,1100,.75),name=rid()+'.jpg';
      const r=await fetch(`${SB_URL}/storage/v1/object/receipts/${name}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'image/jpeg'},body:b});
      if(r.ok)receipt=`${SB_URL}/storage/v1/object/public/receipts/${name}`;else if(!f.ref)throw new Error('تعذّر رفع الصورة، اكتب رقم العملية بدلها')}
      catch(e){if(!f.ref)throw e}}
    const payName=(payMethods().find(m=>m.k==S.pay)||{}).name||'كاش عند الاستلام';
    const res=await api('/rest/v1/rpc/place_order',{method:'POST',body:JSON.stringify({
      p_name:f.name,p_phone:f.phone,p_area:f.area,p_address:f.address,p_notes:[f.notes,shipNote(),promoNote(),optsNote(),optPriceNote(),attrNote()].filter(Boolean).join(' | '),p_pay:payName,p_pay_ref:f.ref||'',p_receipt:receipt,
      p_items:items().map(x=>({code:x.p.code,qty:x.q}))})});
    S.done={...res,delivery:delivery(),total:netTot(),promo:(promoCalc()||{disc:0}).disc,promoName:(promoCalc()||{}).name||'',pay:payName,ref:f.ref,name:f.name,phone:f.phone,area:f.area,address:f.address,notes:f.notes,lines:items().map(x=>({n:x.p.name+' '+(x.p.size||'')+(hasOpts(x.p)?' ('+optText(x.p)+')':''),q:x.q,t:(((promoCalc()||{codes:[]}).codes.includes(x.p.code))?unitOrig(x.p):unit(x.p))*x.q}))};
    track('Purchase',{value:S.done.total,id:'TT'+S.done.no,items:cartItemsT()});S.cart={};saveCart();S.view='done';
    for(const p of S.products){const el=$('#c-'+p.code);if(el)el.innerHTML=ctl(p)}
    updCart()
  }catch(e){S.err=e.message||'حصلت مشكلة، حاول تاني'}
  S.busy=false;drawDrawer()}

function waLink(){const d=S.done,w=String(S.shop.whatsapp||'').replace(/\D/g,'');if(!w||!d)return '';
  const t=`*طلب جديد من الموقع #${d.no}*\n👤 ${d.name}\n📞 ${d.phone}\n📍 ${[d.area,d.address].filter(Boolean).join(' - ')}\n\n`+d.lines.map(l=>`• ${l.n} × ${l.q} = ${n2(l.t)}`).join('\n')+(d.promo>0?`\n🏷️ ${d.promoName}: -${n2(d.promo)}`:'')+(d.delivery>0?`\nالتوصيل: ${n2(d.delivery)}`:'')+`\n*الإجمالي: ${n2(d.total)} ج*\nالدفع: ${d.pay}${d.ref?'\nمرجع: '+d.ref:''}${d.notes?'\nملاحظات: '+d.notes:''}`;
  return 'https://wa.me/'+w+'?text='+encodeURIComponent(t)}
function doneHTML(){const d=S.done;if(!d)return '';const wl=waLink();
  return `<div class="done"><div class="big">👑</div><h4>وصلنا طلبك يا ${esc(d.name)}!</h4><div class="no">طلب رقم ${d.no}</div>
  <p>الإجمالي <b>${n2(d.total)} ج</b> — ${esc(d.pay)}</p>
  <p style="color:var(--mut)">هنتواصل معاك على <b>${esc(d.phone)}</b> لتأكيد الطلب.</p>
  ${wl?`<a class="btn wa" onclick="track('Contact')" href="${wl}" target="_blank" rel="noopener">💬 ابعت تفاصيل الطلب على واتساب</a><p style="font-size:13px;color:var(--mut)">اضغط الزرار عشان الطلب يوصل لنا أسرع.</p>`:''}</div>`}

document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeCart();closeProd()}});
load();logVisit();
</script>
